<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Liminal Field</title>
  <desc id="desc">A synthetic archival fabric installation artwork for Amina El Badri's guided demo profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b2226"/><stop offset=".45" stop-color="#6b554d"/><stop offset="1" stop-color="#c9ad86"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5e9cf"/><stop offset="1" stop-color="#b89270"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8c1c7" stop-opacity=".8"/><stop offset=".5" stop-color="#8d6976" stop-opacity=".55"/><stop offset="1" stop-color="#3d2c39" stop-opacity=".22"/></linearGradient>
    <radialGradient id="halo" cx="62%" cy="38%" r="52%"><stop stop-color="#ffdca0" stop-opacity=".86"/><stop offset=".4" stop-color="#f4bd78" stop-opacity=".3"/><stop offset="1" stop-color="#f4bd78" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".66" numOctaves="4" seed="21"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <ellipse cx="985" cy="440" rx="560" ry="420" fill="url(#halo)" filter="url(#soft)"/>
  <g stroke="#eadbc2" stroke-opacity=".38" stroke-width="3">
