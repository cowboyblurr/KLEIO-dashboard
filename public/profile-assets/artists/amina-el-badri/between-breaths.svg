<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Between Breaths</title>
  <desc id="desc">A synthetic light and fabric installation artwork for Amina El Badri's guided demo profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171521"/><stop offset="0.48" stop-color="#33283f"/><stop offset="1" stop-color="#7a563c"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%"><stop stop-color="#fff5c8" stop-opacity=".92"/><stop offset=".28" stop-color="#f6c88a" stop-opacity=".48"/><stop offset="1" stop-color="#8d5a45" stop-opacity="0"/></radialGradient>
