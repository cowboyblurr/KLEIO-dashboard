<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Finishing Instagram connection</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfbfe;color:#292631;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,420px);padding:28px;border:1px solid #e2dcf1;border-radius:24px;background:#fff;box-shadow:0 24px 80px rgba(82,64,130,.12);text-align:center}.mark{width:48px;height:48px;margin:0 auto;display:grid;place-items:center;border-radius:999px;background:#f1edf8;color:#5b4b8a;font-weight:800;font-size:20px}h1{margin:16px 0 0;font-family:Georgia,serif;font-size:1.65rem;line-height:1.2}p{margin:12px 0 0;color:#746e80;line-height:1.6;font-size:.95rem}.actions{display:none;margin-top:20px;gap:10px}.actions.visible{display:grid}button,a{min-height:44px;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.primary{border:0;background:#5b4b8a;color:#fff}.secondary{border:1px solid #d8d0f2;background:#fff;color:#5b4b8a}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div id="mark" class="mark" aria-hidden="true">…</div>
    <h1 id="title">Finishing Instagram connection</h1>
    <p id="body">KLEIO is returning your authorization result to the original Import Studio.</p>
    <div id="actions" class="actions">
      <button id="closeButton" class="primary" type="button">Close window</button>
      <a class="secondary" href="/artist-dashboard/import/">Return to Import Studio</a>
    </div>
  </main>
  <script>
    (() => {
      const callbackOrigin = "https://trekynurdgxgtaaqqtyq.supabase.co";
      const url = new URL(window.location.href);
      const result = url.searchParams.get("instagram_result") || "instagram_oauth_failed";
      const username = url.searchParams.get("instagram_username") || "";
      const success = result === "instagram_oauth_success";
      const payload = {
        type: "kleio-instagram-oauth",
        success,
        username,
        message: result,
      };

      const mark = document.getElementById("mark");
      const title = document.getElementById("title");
      const body = document.getElementById("body");
      const actions = document.getElementById("actions");
      const closeButton = document.getElementById("closeButton");
      const showFallback = () => actions && actions.classList.add("visible");

      document.title = success ? "Instagram connected" : "Instagram connection needs attention";
      if (mark) mark.textContent = success ? "✓" : "!";
      if (title) title.textContent = success ? "Instagram connected" : result === "instagram_oauth_cancelled" ? "Authorization cancelled" : "Connection needs attention";
      if (body) body.textContent = success ? "Your media gallery is opening in the original KLEIO window." : result === "instagram_oauth_cancelled" ? "Nothing was connected. Return to the original KLEIO window to try again." : "Return to the original KLEIO window and start a fresh Instagram connection.";
      if (closeButton) closeButton.addEventListener("click", () => window.close());

      url.searchParams.delete("instagram");
      url.searchParams.delete("instagram_result");
      url.searchParams.delete("instagram_username");
      window.history.replaceState({}, "", `${url.pathname}${url.search}${url.hash}`);

      if (window.opener && !window.opener.closed) {
        try {
          const callbackEvent = new MessageEvent("message", {
            data: payload,
            origin: callbackOrigin,
          });
          window.opener.dispatchEvent(callbackEvent);
          window.setTimeout(() => window.close(), 80);
          window.setTimeout(showFallback, 700);
          return;
        } catch (_) {
          showFallback();
          return;
        }
      }

      showFallback();
    })();
  </script>
</body>
</html>
