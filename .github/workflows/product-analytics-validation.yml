name: Product Analytics Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/analytics/**"
      - "app/privacy/product-analytics/**"
      - "components/kleio/admin-product-analytics-dashboard.tsx"
      - "components/kleio/artist-import-studio.tsx"
      - "lib/kleio-admin-analytics.ts"
      - "lib/kleio-product-analytics.ts"
      - "lib/kleio-product-event-dictionary.ts"
      - "scripts/audit-product-analytics-*.mjs"
      - "supabase/migrations/20260803162*.sql"
      - "docs/product-analytics-architecture.md"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://www.kleioarthouse.com

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit analytics architecture
        run: pnpm audit:product-analytics

      - name: Audit analytics metadata privacy
        run: pnpm audit:analytics-privacy

      - name: Audit critical event coverage
        run: pnpm audit:analytics-coverage

      - name: Audit administrator authorization
        run: pnpm audit:analytics-admin

      - name: Audit acquisition attribution
        run: pnpm audit:analytics-attribution

      - name: Run inherited authentication audits
        run: |
          pnpm audit:auth-isolation
          pnpm audit:auth-redirect

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build static export
        run: pnpm build

      - name: Run inherited navigation and copy audits
        run: |
          pnpm audit:navigation
          pnpm audit:user-copy
