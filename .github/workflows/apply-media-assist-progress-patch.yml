name: Apply Media Assist Progress Patch

on:
  push:
    branches:
      - fix/media-assist-progress-20260808

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-assist-progress-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: node scripts/apply-media-assist-progress-patch.mjs
      - name: Run focused regression
        run: node tests/media-assist-long-request-recovery.test.mjs
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/kleio/media-intelligence-sheet.tsx lib/kleio-media-intelligence.ts tests/media-assist-long-request-recovery.test.mjs
          git diff --cached --check
          git commit -m "Improve Media Assist long-analysis progress and recovery"
          git push origin HEAD:fix/media-assist-progress-20260808
