name: Run Instagram OAuth repair

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/instagram-oauth-state-and-callback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Extract and run verified patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/patch-instagram-oauth.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          script = script.replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)",
          )
          Path('/tmp/apply-instagram-patch.py').write_text(script)
          PY
          python /tmp/apply-instagram-patch.py

      - name: Commit repaired source
        shell: bash
        run: |
          rm -f .github/workflows/patch-instagram-oauth.yml .github/workflows/run-instagram-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Instagram OAuth state lifecycle and callback"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
