name: Deploy Website Organizer

on:
  push:
    branches:
      - fix/website-import-integration-ready
    paths:
      - .github/workflows/deploy-website-organizer.yml
      - supabase/functions/organize-website-evidence/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Verify deployment credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Configure Gemini function secrets when available
        run: |
          supabase secrets set GEMINI_MODEL=gemini-3.6-flash --project-ref trekynurdgxgtaaqqtyq
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref trekynurdgxgtaaqqtyq
          else
            echo "GEMINI_API_KEY is not configured in GitHub Actions; the function will deploy with manual-review fallback."
          fi

      - name: Deploy authenticated website organizer
        run: supabase functions deploy organize-website-evidence --project-ref trekynurdgxgtaaqqtyq
