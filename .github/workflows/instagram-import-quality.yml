name: Instagram import quality

on:
  pull_request:
    paths:
      - components/kleio/instagram-import-assist.tsx
      - lib/kleio-instagram-import.ts
      - scripts/audit-instagram-import.mjs
      - supabase/functions/instagram-import/**
      - supabase/migrations/*instagram*
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/instagram-import-quality.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Instagram audit
        run: pnpm audit:instagram-import

      - name: Production build
        run: pnpm build
