name: Apply Gmail Provider Start Safety Patch

on:
  push:
    branches:
      - feature/gmail-send-beta-20260808
    paths:
      - ".github/workflows/apply-gmail-provider-start-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gmail-send-beta-20260808
          fetch-depth: 0
      - name: Harden ambiguous-provider send state
        shell: python
        run: |
          from pathlib import Path

          migration = Path("supabase/migrations/20260808170000_gmail_send_only_beta.sql")
          s = migration.read_text()

          s = s.replace(
              "  add column if not exists provider_send_claimed_at timestamptz,\n  add column if not exists provider_unknown_at timestamptz;",
              "  add column if not exists provider_send_claimed_at timestamptz,\n  add column if not exists provider_request_started_at timestamptz,\n  add column if not exists provider_unknown_at timestamptz;",
          )

          old = '''    if delivery_row.state='provider_sending'
       and delivery_row.provider_send_claimed_at > now()-interval '2 minutes' then
      return jsonb_build_object('status','send_in_progress','delivery_id',delivery_row.id);
    end if;
'''
          new = '''    if delivery_row.state='provider_sending'
       and delivery_row.provider_request_started_at is not null then
      update public.application_deliveries
      set state='provider_unknown',
          provider_unknown_at=coalesce(provider_unknown_at,now()),
          updated_at=now()
      where id=delivery_row.id
      returning * into delivery_row;
      return jsonb_build_object('status','provider_status_unknown','delivery_id',delivery_row.id);
    end if;
    if delivery_row.state='provider_sending'
       and delivery_row.provider_send_claimed_at > now()-interval '2 minutes' then
      return jsonb_build_object('status','send_in_progress','delivery_id',delivery_row.id);
    end if;
'''
          if old not in s:
              raise SystemExit("claim in-progress block not found")
          s = s.replace(old, new, 1)

          old = '''        provider_send_claim_id=claim_id,
        provider_send_claimed_at=now(),
        last_error_code='',
'''
          new = '''        provider_send_claim_id=claim_id,
        provider_send_claimed_at=now(),
        provider_request_started_at=null,
        last_error_code='',
'''
          if old not in s:
              raise SystemExit("claim reset block not found")
          s = s.replace(old, new, 1)

          marker = '''create or replace function public.mark_gmail_delivery_result_service(
'''
          function = '''create or replace function public.mark_gmail_provider_request_started_service(
  target_artist_user_id uuid,
  target_delivery_id uuid,
  target_claim_id uuid
)
returns boolean
language plpgsql
security definer
set search_path to 'public'
as $$
begin
  update public.application_deliveries
  set provider_request_started_at=coalesce(provider_request_started_at,now()),
      updated_at=now()
  where id=target_delivery_id
    and artist_user_id=target_artist_user_id
    and channel='gmail'
    and state='provider_sending'
    and provider_send_claim_id=target_claim_id;

  if not found then
    raise exception 'gmail_delivery_claim_not_found';
  end if;
  return true;
end;
$$;

'''
          if marker not in s:
              raise SystemExit("mark-result marker not found")
          s = s.replace(marker, function + marker, 1)

          revoke_marker = '''revoke all on function public.mark_gmail_delivery_result_service(uuid,uuid,uuid,text,text,text,text) from public,anon,authenticated;
'''
          if revoke_marker not in s:
              raise SystemExit("revoke marker not found")
          s = s.replace(
              revoke_marker,
              "revoke all on function public.mark_gmail_provider_request_started_service(uuid,uuid,uuid) from public,anon,authenticated;\n" + revoke_marker,
              1,
          )
          grant_marker = '''grant execute on function public.mark_gmail_delivery_result_service(uuid,uuid,uuid,text,text,text,text) to service_role;
'''
          if grant_marker not in s:
              raise SystemExit("grant marker not found")
          s = s.replace(
              grant_marker,
              "grant execute on function public.mark_gmail_provider_request_started_service(uuid,uuid,uuid) to service_role;\n" + grant_marker,
              1,
          )
          migration.write_text(s)

          edge = Path("supabase/functions/gmail-delivery/index.ts")
          e = edge.read_text()
          old = '''        providerCallStarted = true
        let sendResponse: Response
'''
          new = '''        const { error: providerStartError } = await admin.rpc("mark_gmail_provider_request_started_service", {
          target_artist_user_id: user.id,
          target_delivery_id: deliveryId,
          target_claim_id: claimId,
        })
        if (providerStartError) throw providerStartError

        providerCallStarted = true
        let sendResponse: Response
'''
          if old not in e:
              raise SystemExit("provider start location not found")
          e = e.replace(old, new, 1)

          old = '''        const delivery = await markDeliveryResult({ userId: user.id, deliveryId, claimId, result: "accepted", providerReference: messageId })
        return json({
'''
          new = '''        let delivery: unknown
        try {
          delivery = await markDeliveryResult({ userId: user.id, deliveryId, claimId, result: "accepted", providerReference: messageId })
        } catch (reason) {
          await markDeliveryResult({
            userId: user.id,
            deliveryId,
            claimId,
            result: "unknown",
            errorCode: "gmail_acceptance_persistence_failed",
            errorMessage: reason instanceof Error ? reason.message : "Gmail accepted the provider request but KLEIO could not persist the acceptance state.",
          }).catch(() => undefined)
          return json({
            error: "gmail_provider_status_unknown",
            message: "Gmail accepted or may have accepted the send, but KLEIO could not safely persist the provider result. Check Gmail Sent before using another delivery path.",
          }, 502)
        }
        return json({
'''
          if old not in e:
              raise SystemExit("accepted persistence block not found")
          e = e.replace(old, new, 1)
          edge.write_text(e)

          audit = Path("scripts/audit-gmail-send-beta.mjs")
          a = audit.read_text()
          anchor = '''must(migration, /provider_send_claim_id[\\s\\S]*provider_send_claimed_at/, "Gmail provider send must have an atomic lease identity.")
'''
          replacement = '''must(migration, /provider_send_claim_id[\\s\\S]*provider_send_claimed_at[\\s\\S]*provider_request_started_at/, "Gmail provider send must distinguish claim time from the moment the provider request actually starts.")
must(migration, /mark_gmail_provider_request_started_service/, "The provider boundary must persist a request-start marker immediately before Gmail is called.")
must(edge, /mark_gmail_provider_request_started_service[\\s\\S]*providerCallStarted = true[\\s\\S]*gmail\\.googleapis\\.com/, "The request-start marker must persist before the Gmail network call begins.")
'''
          if anchor not in a:
              raise SystemExit("audit claim anchor not found")
          a = a.replace(anchor, replacement, 1)
          unknown_anchor = '''must(edge, /gmail_provider_status_unknown[\\s\\S]*Check Gmail Sent/, "Ambiguous Gmail response must direct the artist to check Sent rather than retry blindly.")
'''
          unknown_replacement = unknown_anchor + '''must(migration, /provider_sending[\\s\\S]*provider_request_started_at is not null[\\s\\S]*provider_unknown/, "A stale in-flight send that crossed the provider boundary must become provider-unknown rather than be retried.")
must(edge, /gmail_acceptance_persistence_failed[\\s\\S]*Check Gmail Sent/, "Failure to persist a known Gmail acceptance must still fail safe as provider-status-unknown.")
'''
          if unknown_anchor not in a:
              raise SystemExit("audit unknown anchor not found")
          a = a.replace(unknown_anchor, unknown_replacement, 1)
          audit.write_text(a)
      - name: Remove temporary workflow and commit product changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-gmail-provider-start-patch.yml
          git config user.name "KLEIO QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260808170000_gmail_send_only_beta.sql supabase/functions/gmail-delivery/index.ts scripts/audit-gmail-send-beta.mjs .github/workflows/apply-gmail-provider-start-patch.yml
          git commit -m "Fail safe after Gmail provider request starts"
          git push origin HEAD:feature/gmail-send-beta-20260808
