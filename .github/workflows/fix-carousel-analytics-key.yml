name: Normalize remaining carousel analytics metadata key

on:
  push:
    branches:
      - agent/gemini-document-intelligence
    paths:
      - ".github/workflows/fix-carousel-analytics-key.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-document-intelligence
          fetch-depth: 0
      - name: Replace access with existing mode key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("components/kleio/public-opportunity-carousel.tsx")
          text = path.read_text()
          old = 'metadata: { result_count: next.length, access: "limited_preview" }'
          if old not in text:
              raise SystemExit("remaining access metadata payload not found")
          path.write_text(text.replace(old, 'metadata: { result_count: next.length, mode: "limited_preview" }'))
          PY
          git config user.name "KLEIO GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/public-opportunity-carousel.tsx
          git commit -m "Use canonical analytics mode key for public preview"
          git push origin HEAD:agent/gemini-document-intelligence
