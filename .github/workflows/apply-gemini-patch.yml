name: Apply staged Gemini document intelligence patch

on:
  push:
    branches:
      - agent/gemini-document-intelligence
    paths:
      - ".kleio-patch/**"
      - ".github/workflows/apply-gemini-patch.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".kleio-patch/**"
      - ".github/workflows/apply-gemini-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-gemini-document-intelligence-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-document-intelligence
          fetch-depth: 0
      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .kleio-patch/chunk_* | base64 --decode > /tmp/kleio-gemini-patch.tgz
          mkdir -p /tmp/kleio-gemini-patch
          tar -xzf /tmp/kleio-gemini-patch.tgz -C /tmp/kleio-gemini-patch

          install -m 0644 /tmp/kleio-gemini-patch/artist-document-intelligence.tsx components/kleio/artist-document-intelligence.tsx
          install -m 0644 /tmp/kleio-gemini-patch/kleio-document-intelligence.ts lib/kleio-document-intelligence.ts
          install -m 0644 /tmp/kleio-gemini-patch/kleio-document-drafting.ts lib/kleio-document-drafting.ts
          install -m 0644 /tmp/kleio-gemini-patch/document-draft-studio.tsx components/kleio/document-draft-studio.tsx
          install -m 0644 /tmp/kleio-gemini-patch/20260805232500_gemini_document_intelligence.sql supabase/migrations/20260805232500_gemini_document_intelligence.sql
          install -m 0644 /tmp/kleio-gemini-patch/gemini-acceptance-cases.json tests/fixtures/document-intelligence/gemini-acceptance-cases.json
          install -m 0644 /tmp/kleio-gemini-patch/gemini-document-intelligence.test.mjs tests/gemini-document-intelligence.test.mjs
          install -m 0644 /tmp/kleio-gemini-patch/audit-gemini-document-intelligence.mjs scripts/audit-gemini-document-intelligence.mjs
          install -m 0644 /tmp/kleio-gemini-patch/audit-document-intelligence-beta.mjs scripts/audit-document-intelligence-beta.mjs
          install -m 0644 /tmp/kleio-gemini-patch/gemini-document-intelligence.yml .github/workflows/gemini-document-intelligence.yml
          install -m 0644 /tmp/kleio-gemini-patch/package.json package.json
          install -m 0644 /tmp/kleio-gemini-patch/gemini-document-intelligence-2026-08-05.md docs/gemini-document-intelligence-2026-08-05.md

          rm -rf .kleio-patch .github/workflows/apply-gemini-patch.yml
          git config user.name "KLEIO GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Gemini PDF understanding and approved-evidence drafting"
          git push origin HEAD:agent/gemini-document-intelligence
