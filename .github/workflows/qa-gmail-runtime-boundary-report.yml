name: QA-only Gmail Runtime Boundary Report

on:
  push:
    branches:
      - qa/gmail-runtime-boundary-20260808
    paths:
      - ".github/workflows/qa-gmail-runtime-boundary-report.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  live-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FN: https://trekynurdgxgtaaqqtyq.supabase.co/functions/v1/gmail-delivery
    steps:
      - name: Prove production runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          post_status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 20 -H 'content-type: application/json' --data '{"action":"status"}' "$FN")"
          test "$post_status" = "401"
          grep -Fq '"authentication_required"' "$body"

          headers="$(mktemp)"
          get_status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 "$FN")"
          test "$get_status" = "302"
          grep -Eiq '^location: https://www\.kleioarthouse\.com/artist-dashboard/applications/.*gmail=error.*code=oauth_state_missing' "$headers"

          cors="$(mktemp)"
          options_status="$(curl --silent --show-error --request OPTIONS --output /dev/null --dump-header "$cors" --write-out '%{http_code}' --max-time 20 "$FN")"
          test "$options_status" = "200"
          grep -Eiq '^access-control-allow-methods:.*POST.*OPTIONS' "$cors"
      - name: Record production proof on QA PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh pr comment 158 --body "Production Gmail runtime boundary: **PASS** on QA probe \`${SHA}\`. The deployed endpoint returns KLEIO's own 401 authentication boundary (confirming the function is active behind custom auth), the Google callback safely redirects on missing OAuth state, and CORS preflight succeeds. No real Gmail account or email was used."
