name: Verify KLEIO

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee lint.log

      - name: Build static export
        id: build
        continue-on-error: true
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
          NEXT_PUBLIC_SUPABASE_URL: https://trekynurdgxgtaaqqtyq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XdYXvd0fQm3IJKxNrFXgUQ_M4RgDj1M
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log

      - name: Verify critical auth and workspace exports
        id: routes
        continue-on-error: true
        run: |
          test -f out/index.html
          test -f out/signup/artist/index.html
          test -f out/signup/institution/index.html
          test -f out/auth/forgot-password/index.html
          test -f out/auth/update-password/index.html
          test -f out/dashboard/index.html
          test -f out/artist-dashboard/index.html
          test -f out/review-room/index.html
          test -f out/messages/index.html

      - name: Audit internal navigation
        id: navigation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run audit:navigation 2>&1 | tee navigation.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            typecheck.log
            lint.log
            build.log
            navigation.log
            pnpm-lock.yaml
          if-no-files-found: warn

      - name: Enforce verification result
        if: always()
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "lint=${{ steps.lint.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          echo "routes=${{ steps.routes.outcome }}"
          echo "navigation=${{ steps.navigation.outcome }}"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.routes.outcome }}" = "success"
          test "${{ steps.navigation.outcome }}" = "success"
