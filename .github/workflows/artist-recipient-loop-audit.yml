name: Artist recipient loop audit

on:
  pull_request:
    paths:
      - "app/application-review/**"
      - "app/artist-dashboard/applications/prepare/**"
      - "app/artist-dashboard/passport/**"
      - "components/kleio/application-recipient-loop-panel.tsx"
      - "components/kleio/recipient-application-review.tsx"
      - "components/kleio/artist-recipient-conversation.tsx"
      - "components/kleio/creative-passport-workspace.tsx"
      - "components/kleio/forms/artist-term-fields.tsx"
      - "lib/kleio-application-alignment.ts"
      - "lib/kleio-passport-completion.ts"
      - "lib/kleio-recipient-application.ts"
      - "lib/kleio-recipient-artist-actions.ts"
      - "lib/kleio-artist-recipient-conversation.ts"
      - "supabase/functions/recipient-application-review/**"
      - "supabase/migrations/20260805161000_artist_recipient_application_loop.sql"
      - "supabase/migrations/20260805163000_artist_workflow_consistency.sql"
      - "supabase/migrations/20260805164500_practice_submission_reset.sql"
      - "scripts/audit-artist-recipient-loop.mjs"
      - "tests/artist-workflow-services.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:artist-recipient-loop
      - run: pnpm test:artist-workflow-services
      - run: pnpm typecheck
      - run: pnpm build
