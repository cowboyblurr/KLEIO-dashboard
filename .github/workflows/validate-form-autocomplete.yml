name: Validate KLEIO Form Autocomplete

on:
  push:
    branches:
      - agent/kleio-form-autocomplete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build static preview without provider token
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://trekynurdgxgtaaqqtyq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_XdYXvd0fQm3IJKxNrFXgUQ_M4RgDj1M
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ""
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Verify normalized form exports
        run: |
          test -f components/kleio/forms/entity-autocomplete.tsx
          test -f components/kleio/forms/controlled-fields.tsx
          test -f lib/kleio-entity-search.ts
          test -f lib/kleio-form-options.ts
          test -f lib/kleio-normalized-data.ts
          grep -q "NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN" .env.example

      - name: Check for committed private credentials
        shell: bash
        run: |
          if git grep -nE '(service_role|sb_secret_)' -- ':!docs/**' ':!supabase/migrations/**' ':!.github/workflows/**'; then
            echo "Potential private Supabase credential reference found."
            exit 1
          fi
          if git grep -nE 'sk\.[A-Za-z0-9_-]{20,}|pk\.[A-Za-z0-9_-]{20,}' -- ':!docs/**' ':!.env.example'; then
            echo "Potential unrestricted provider token found."
            exit 1
          fi
