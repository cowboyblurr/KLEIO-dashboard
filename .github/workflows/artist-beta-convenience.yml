name: Artist Beta Convenience

on:
  pull_request:
    paths:
      - "app/**"
      - "components/kleio/**"
      - "lib/kleio-application-composer.ts"
      - "lib/kleio-universal-media.ts"
      - "lib/kleio-import-source-availability.ts"
      - "lib/kleio-media-file-types.ts"
      - "lib/kleio-requirement-file-types.ts"
      - "lib/kleio-requirement-file-upload.ts"
      - "supabase/migrations/*required_application_file*"
      - "supabase/migrations/*media_upload*"
      - "scripts/audit-artist-beta-convenience.mjs"
      - "scripts/audit-artist-requirement-channel-separation.mjs"
      - "scripts/audit-artist-requirement-file-types.mjs"
      - "scripts/audit-upload-surface-consistency.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:upload-surfaces
      - run: pnpm audit:artist-beta-convenience
      - run: pnpm audit:artist-requirement-channels
      - run: pnpm audit:artist-requirement-file-types
      - run: pnpm audit:artist-beta-readiness
      - run: pnpm audit:application-composer
      - run: pnpm audit:artist-recipient-loop
      - run: pnpm audit:visual-convenience
      - run: pnpm test:artist-workflow-services
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit:navigation
