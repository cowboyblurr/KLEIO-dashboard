name: Upload Contract Validation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/kleio/**"
      - "lib/kleio-device-media-upload.ts"
      - "lib/kleio-document-profile-synthesis.ts"
      - "lib/kleio-import-source-availability.ts"
      - "lib/kleio-media-control.ts"
      - "lib/kleio-media-collection-intelligence.ts"
      - "lib/kleio-media-file-types.ts"
      - "lib/kleio-media-intelligence.ts"
      - "lib/kleio-requirement-file-types.ts"
      - "lib/kleio-requirement-file-upload.ts"
      - "scripts/audit-artist-media-control.mjs"
      - "scripts/audit-media-collection-intelligence.mjs"
      - "scripts/audit-passport-synthesis-orchestration.mjs"
      - "scripts/audit-upload-surface-consistency.mjs"
      - "scripts/audit-public-roadmap-copy.mjs"
      - "tests/passport-synthesis-orchestration.test.mjs"
      - "supabase/functions/_shared/passport-synthesis-qa.mjs"
      - "supabase/functions/analyze-artist-media/**"
      - "supabase/functions/analyze-artist-media-collection/**"
      - "supabase/functions/synthesize-artist-source-profile-v2/**"
      - "supabase/migrations/*media*"
      - "package.json"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:artist-media-control
      - run: node scripts/audit-media-collection-intelligence.mjs
      - run: pnpm audit:upload-surfaces
      - run: pnpm audit:universal-media
      - run: pnpm audit:artist-requirement-file-types
      - run: pnpm audit:document-intelligence
      - run: pnpm audit:passport-synthesis-orchestration
      - run: pnpm test:passport-synthesis-orchestration
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/audit-public-roadmap-copy.mjs
