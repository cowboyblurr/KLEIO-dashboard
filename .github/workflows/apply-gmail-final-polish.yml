name: Apply Gmail Final Polish

on:
  push:
    branches:
      - feature/gmail-send-beta-20260808
    paths:
      - ".github/workflows/apply-gmail-final-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gmail-send-beta-20260808
          fetch-depth: 0
      - name: Fix reconciliation copy and OAuth state hygiene
        shell: python
        run: |
          from pathlib import Path

          control = Path("components/kleio/gmail-delivery-control.tsx")
          s = control.read_text()
          old = '''{state === "provider_accepted" ? "Connected Gmail accepted this preserved version for sending." : state === "review_room_opened" ? "The Review Room has been opened after Gmail delivery." : state === "receipt_confirmed" ? "The recipient confirmed receipt in KLEIO." : "A KLEIO conversation has started for this application."}'''
          new = '''{state === "provider_accepted" ? "Connected Gmail accepted this preserved version for sending." : state === "artist_reported_sent" ? "You checked Gmail Sent and confirmed this preserved version is present there." : state === "review_room_opened" ? "The Review Room has been opened after Gmail delivery." : state === "receipt_confirmed" ? "The recipient confirmed receipt in KLEIO." : "A KLEIO conversation has started for this application."}'''
          if old not in s:
              raise SystemExit("completed-state copy anchor missing")
          s = s.replace(old, new, 1)
          control.write_text(s)

          edge = Path("supabase/functions/gmail-delivery/index.ts")
          e = edge.read_text()
          old = '''      const returnPath = text(body.return_path)
      const safeReturnPath = validReturnPath(returnPath) ? returnPath : "/artist-dashboard/applications/"
      const rawState = randomHex()
      const { error } = await admin.from("gmail_oauth_states").insert({
'''
          new = '''      const returnPath = text(body.return_path)
      const safeReturnPath = validReturnPath(returnPath) ? returnPath : "/artist-dashboard/applications/"
      const now = new Date().toISOString()
      await admin.from("gmail_oauth_states").delete().eq("artist_user_id", user.id).or(`used_at.not.is.null,expires_at.lt.${now}`)
      const { count: activeStateCount, error: stateCountError } = await admin
        .from("gmail_oauth_states")
        .select("id", { count: "exact", head: true })
        .eq("artist_user_id", user.id)
        .is("used_at", null)
        .gt("expires_at", now)
      if (stateCountError) throw stateCountError
      if ((activeStateCount ?? 0) >= 3) return json({ error: "gmail_oauth_too_many_requests", message: "A Gmail connection is already in progress. Finish or wait a few minutes before starting another." }, 429)

      const rawState = randomHex()
      const { error } = await admin.from("gmail_oauth_states").insert({
'''
          if old not in e:
              raise SystemExit("OAuth connect anchor missing")
          e = e.replace(old, new, 1)
          edge.write_text(e)

          audit = Path("scripts/audit-gmail-send-beta.mjs")
          a = audit.read_text()
          anchor = '''must(migration, /gmail_oauth_states[\\s\\S]*expires_at[\\s\\S]*used_at/, "OAuth state must expire and be one-time use.")
'''
          add = anchor + '''must(edge, /activeStateCount[\\s\\S]*>= 3[\\s\\S]*gmail_oauth_too_many_requests/, "Repeated Gmail Connect clicks must be bounded rather than accumulating unlimited active OAuth states.")
'''
          if anchor not in a:
              raise SystemExit("OAuth state audit anchor missing")
          a = a.replace(anchor, add, 1)
          artist_anchor = '''must(control, /Connecting Gmail is optional/, "Gmail must remain optional rather than a submission gate.")
'''
          artist_add = '''must(control, /artist_reported_sent[\\s\\S]*confirmed this preserved version is present there/, "Self-reconciled Gmail Sent evidence must be described as artist-confirmed rather than as a conversation or provider-confirmed event.")
''' + artist_anchor
          if artist_anchor not in a:
              raise SystemExit("artist optional audit anchor missing")
          a = a.replace(artist_anchor, artist_add, 1)
          audit.write_text(a)
      - name: Remove temporary workflow and commit final polish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-gmail-final-polish.yml
          git config user.name "KLEIO QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/gmail-delivery-control.tsx supabase/functions/gmail-delivery/index.ts scripts/audit-gmail-send-beta.mjs .github/workflows/apply-gmail-final-polish.yml
          git commit -m "Tighten Gmail reconciliation copy and OAuth state hygiene"
          git push origin HEAD:feature/gmail-send-beta-20260808
