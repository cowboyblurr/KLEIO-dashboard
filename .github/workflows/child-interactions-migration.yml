name: Child Gemini Interactions migration

on:
  push:
    branches:
      - agent/gemini-interactions-migration
    paths:
      - ".github/workflows/child-interactions-migration.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/child-interactions-migration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-interactions-migration
          fetch-depth: 0
      - name: Replace provider transport with stateless Interactions API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/functions/_shared/gemini-document-intelligence.ts")
          text = path.read_text()
          if 'https://generativelanguage.googleapis.com/v1beta/interactions' in text:
              print('Interactions adapter already applied.')
              raise SystemExit(0)
          start = text.index("function parseProviderText")
          end = text.index("const stringArray", start)
          replacement = r'''function parseProviderText(payload: JsonObject) {
  const steps = Array.isArray(payload.steps) ? payload.steps.filter(object) : []
  const modelOutputs = steps.filter((step) => step.type === "model_output")
  const content = modelOutputs.flatMap((step) => Array.isArray(step.content) ? step.content.filter(object) : [])
  return content.filter((part) => part.type === "text").map((part) => cleanText(part.text, 2_000_000)).filter(Boolean).join("")
}

function providerError(status: number, payload: JsonObject) {
  const error = object(payload.error) ? payload.error : {}
  const message = cleanText(error.message || payload.message, 500).toLowerCase()
  if (status === 401 || status === 403) return "gemini_authentication_failed"
  if (status === 429) return "gemini_rate_limited"
  if (status >= 500) return "gemini_provider_unavailable"
  if (message.includes("schema") || message.includes("response_format")) return "gemini_schema_rejected"
  if (message.includes("model")) return "gemini_model_unavailable"
  return "gemini_request_failed"
}

function interactionUsage(payload: JsonObject) {
  const usage = object(payload.usage) ? payload.usage : {}
  const input = Number(usage.input_tokens ?? usage.inputTokenCount ?? usage.prompt_token_count ?? usage.promptTokenCount ?? 0)
  const output = Number(usage.output_tokens ?? usage.outputTokenCount ?? usage.candidates_token_count ?? usage.candidatesTokenCount ?? 0)
  const total = Number(usage.total_tokens ?? usage.totalTokenCount ?? usage.total_token_count ?? 0)
  return { input_tokens: Number.isFinite(input) ? input : 0, output_tokens: Number.isFinite(output) ? output : 0, total_tokens: Number.isFinite(total) && total > 0 ? total : Math.max(0, input + output) }
}

export async function runGeminiStructured<T>(input: RunGeminiInput): Promise<ProviderResult<T>> {
  if (!input.apiKey) throw new Error("gemini_not_configured")
  const controller = new AbortController()
  const timer = setTimeout(() => controller.abort(), input.timeoutMs ?? 88_000)
  const started = Date.now()
  try {
    const interactionInput: JsonObject[] = []
    if (input.pdfBytes) interactionInput.push({ type: "document", mime_type: "application/pdf", data: base64(input.pdfBytes) })
    interactionInput.push({ type: "text", text: `${input.systemInstruction}\n\n${input.prompt}` })
    const schema = supportedJsonSchema(input.responseSchema)
    const response = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json", "x-goog-api-key": input.apiKey },
      body: JSON.stringify({ model: input.model, input: interactionInput, response_format: { type: "text", mime_type: "application/json", schema }, store: false }),
    })
    const payload = await response.json().catch(() => ({})) as JsonObject
    if (!response.ok) throw new Error(providerError(response.status, payload))
    const text = parseProviderText(payload)
    if (!text) throw new Error("gemini_returned_no_output")
    let output: T
    try { output = JSON.parse(text) as T } catch { throw new Error("gemini_invalid_structured_output") }
    return { output, provider: GEMINI_PROVIDER, model: input.model, requestId: cleanText(payload.id, 200) || response.headers.get("x-request-id") || response.headers.get("x-goog-request-id") || "", latencyMs: Date.now() - started, usage: interactionUsage(payload) }
  } catch (reason) {
    if (reason instanceof DOMException && reason.name === "AbortError") throw new Error("gemini_timeout")
    throw reason
  } finally { clearTimeout(timer) }
}

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name "KLEIO GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/_shared/gemini-document-intelligence.ts
          git commit -m "Use stateless Gemini Interactions API for document intelligence"
          git push origin HEAD:agent/gemini-interactions-migration
