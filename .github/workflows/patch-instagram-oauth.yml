              - name: Upload verification logs
                if: always()''',
          )
          replace_once(ci_path, '            user-copy.log', '            user-copy.log\n            instagram-import.log')
          replace_once(ci_path, '          echo "user_copy=${{ steps.user_copy.outcome }}"', '          echo "user_copy=${{ steps.user_copy.outcome }}"\n          echo "instagram_import=${{ steps.instagram_import.outcome }}"')
          replace_once(ci_path, '          test "${{ steps.user_copy.outcome }}" = "success"', '          test "${{ steps.user_copy.outcome }}" = "success"\n          test "${{ steps.instagram_import.outcome }}" = "success"')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-instagram-oauth.yml
          git config user.name "github-actions[bot]"
