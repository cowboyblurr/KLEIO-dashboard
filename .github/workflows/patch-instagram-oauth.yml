name: Apply Instagram OAuth repair

on:
  push:
    branches: ["fix/instagram-oauth-state-and-callback"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Apply verified OAuth fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one exact match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern[:80]}")
              file.write_text(updated)

          edge_path = "supabase/functions/instagram-import/index.ts"
          replace_once(
              edge_path,
              'const API_VERSION = (Deno.env.get("META_INSTAGRAM_API_VERSION") || "v25.0").replace(/^\\/+|\\/+$/g, "")\nconst DEFAULT_REDIRECT_URI = `${SUPABASE_URL}/functions/v1/instagram-import`\nconst REDIRECT_URI = Deno.env.get("META_INSTAGRAM_REDIRECT_URI") || DEFAULT_REDIRECT_URI',
              'const API_VERSION = (Deno.env.get("META_INSTAGRAM_API_VERSION") || "v25.0").replace(/^\\/+|\\/+$/g, "")\nconst REDIRECT_URI = "https://trekynurdgxgtaaqqtyq.supabase.co/functions/v1/instagram-import"',
          )
          replace_once(
              edge_path,
              'const OAUTH_WINDOW_MS = 15 * 60 * 1000\nconst OAUTH_MAX_STARTS = 5',
              'const OAUTH_WINDOW_MS = 15 * 60 * 1000\nconst OAUTH_PROCESSING_STALE_MS = 2 * 60 * 1000\nconst OAUTH_MAX_STARTS = 5',
          )

          replace_once(
              edge_path,
              '''function json(req: Request, body: unknown, status = 200) {
            return new Response(JSON.stringify(body), {
              status,
              headers: { ...corsHeaders(req), "Content-Type": "application/json; charset=utf-8", "Cache-Control": "no-store" },
            })
          }

          function errorCode(reason: unknown) {''',
              '''function json(req: Request, body: unknown, status = 200) {
            return new Response(JSON.stringify(body), {
              status,
              headers: { ...corsHeaders(req), "Content-Type": "application/json; charset=utf-8", "Cache-Control": "no-store" },
            })
          }

          function htmlResponse(markup: string, status = 200) {
            return new Response(markup, {
              status,
              headers: {
                "Content-Type": "text/html; charset=utf-8",
                "Cache-Control": "no-store, max-age=0",
                "Content-Security-Policy": "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'",
                "Referrer-Policy": "no-referrer",
                "X-Content-Type-Options": "nosniff",
                "X-Frame-Options": "DENY",
              },
            })
          }

          function errorCode(reason: unknown) {''',
          )

          sub_once(
              edge_path,
              r'async function exchangeAuthorizationCode\(code: string\) \{.*?\n\}\n\nasync function exchangeLongLivedToken',
              '''class InstagramOAuthError extends Error {
            diagnostics: JsonRecord

            constructor(category: string, diagnostics: JsonRecord = {}) {
              super(category)
              this.name = "InstagramOAuthError"
              this.diagnostics = diagnostics
            }
          }

          function oauthDiagnostics(reason: unknown) {
            return reason instanceof InstagramOAuthError ? reason.diagnostics : {}
          }

          function normalizeCodeExchangeFailure(data: JsonRecord, status: number) {
            const nested = asRecord(data.error)
            const type = cleanText(nested.type || data.error_type, 100)
            const code = idText(nested.code ?? data.code, 40)
            const subcode = idText(nested.error_subcode ?? data.error_subcode, 40)
            const rawMessage = cleanText(nested.message || data.error_message || data.message, 500).toLowerCase()
            const category = rawMessage.includes("redirect_uri") || rawMessage.includes("redirect uri")
              ? "instagram_code_exchange_redirect_mismatch"
              : rawMessage.includes("verification code") || rawMessage.includes("invalid code") || rawMessage.includes("authorization code")
                ? "instagram_code_exchange_invalid_code"
                : rawMessage.includes("client") || code === "101"
                  ? "instagram_code_exchange_invalid_client"
                  : status === 429 || rawMessage.includes("rate")
                    ? "instagram_code_exchange_rate_limited"
                    : status >= 500
                      ? "instagram_code_exchange_network_error"
                      : "instagram_code_exchange_unknown"
            return {
              category,
              diagnostics: {
                http_status: status,
                error_type: type,
                error_code: code,
                error_subcode: subcode,
              },
            }
          }

          async function exchangeAuthorizationCode(code: string) {
            const body = new FormData()
            body.set("client_id", INSTAGRAM_APP_ID)
            body.set("client_secret", INSTAGRAM_APP_SECRET)
            body.set("grant_type", "authorization_code")
            body.set("redirect_uri", REDIRECT_URI)
            body.set("code", code.replace(/#_$/, ""))
            let response: Response
            try {
              response = await fetch("https://api.instagram.com/oauth/access_token", {
                method: "POST",
                headers: { "Accept": "application/json" },
                body,
              })
            } catch {
              throw new InstagramOAuthError("instagram_code_exchange_network_error")
            }
            const data = await response.json().catch(() => ({})) as JsonRecord
            if (!response.ok || !cleanText(data.access_token) || !idText(data.user_id, 120)) {
              const failure = normalizeCodeExchangeFailure(data, response.status)
              throw new InstagramOAuthError(failure.category, failure.diagnostics)
            }
            return {
              accessToken: cleanText(data.access_token, 5_000),
              userId: idText(data.user_id, 120),
              permissions: Array.isArray(data.permissions) ? data.permissions.map((value) => cleanText(value, 100)).filter(Boolean) : [],
              expiresIn: Number(data.expires_in) || 3_600,
            }
          }

          async function exchangeLongLivedToken''',
              flags=re.S,
          )

          sub_once(
              edge_path,
              r'async function logEvent\(artistUserId: string, eventType: string, instagramUserId: string \| null, mediaCount = 0, metadata: JsonRecord = \{\}\) \{.*?\n\}\n\nfunction popupHtml.*?\n\}\n\nasync function handleOAuthCallback.*?\n\}\n\nfunction normalizeCursor',
              '''async function logEvent(artistUserId: string, eventType: string, instagramUserId: string | null, mediaCount = 0, metadata: JsonRecord = {}) {
            try {
              const { error } = await admin.from("artist_instagram_import_events").insert({
                artist_user_id: artistUserId,
                event_type: eventType,
                instagram_user_id: instagramUserId,
                media_count: mediaCount,
                metadata,
              })
              if (error) console.warn("instagram_event_log_failed", { code: error.code || "unknown" })
            } catch {
              console.warn("instagram_event_log_failed")
            }
          }

          type OAuthPopupKind = "success" | "expired" | "cancelled" | "invalid" | "consumed" | "in_progress" | "failed"

          function popupCopy(kind: OAuthPopupKind) {
            if (kind === "success") return {
              title: "Instagram connected",
              body: "Your Instagram account is connected to KLEIO. This window can close.",
            }
            if (kind === "expired") return {
              title: "This connection attempt expired",
              body: "Return to KLEIO and start a fresh Instagram connection.",
            }
            if (kind === "cancelled") return {
              title: "Instagram authorization was cancelled",
              body: "Nothing was connected. Return to KLEIO whenever you are ready to try again.",
            }
            if (kind === "consumed") return {
              title: "This connection link was already used",
              body: "Return to KLEIO and start a fresh Instagram connection.",
            }
            if (kind === "in_progress") return {
              title: "Instagram connection is already processing",
              body: "Return to KLEIO and wait a moment before trying again.",
            }
            if (kind === "invalid") return {
              title: "Instagram connection could not be verified",
              body: "Return to KLEIO and start the connection again.",
            }
            return {
              title: "Instagram connection needs attention",
              body: "KLEIO could not complete this connection. Return to KLEIO and try again.",
            }
          }

          function popupHtml(input: { kind: OAuthPopupKind; returnUrl: string; username?: string }) {
            const copy = popupCopy(input.kind)
            const payload = JSON.stringify({
              type: "kleio-instagram-oauth",
              success: input.kind === "success",
              message: `instagram_oauth_${input.kind}`,
              username: input.username || "",
            }).replace(/</g, "\\u003c")
            const target = JSON.stringify(new URL(input.returnUrl).origin)
            const returnUrl = JSON.stringify(input.returnUrl)
            return `<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>${copy.title}</title><style>body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfbfe;color:#292631}.card{max-width:34rem;margin:2rem;padding:2rem;border:1px solid #e2dcf1;border-radius:24px;background:white;box-shadow:0 24px 70px rgba(82,64,130,.12)}h1{font-family:Georgia,serif;margin:0 0 .75rem;font-size:1.75rem}p{line-height:1.65;color:#6f6879}a{color:#5b4b8a;font-weight:700}</style></head>
          <body><main class="card"><h1>${copy.title}</h1><p>${copy.body}</p><p><a href=${returnUrl}>Return to KLEIO</a></p></main>
          <script>
          const payload=${payload};const target=${target};const returnUrl=${returnUrl};
          try{if(window.opener&&!window.opener.closed){window.opener.postMessage(payload,target);setTimeout(()=>window.close(),250)}else{window.location.replace(returnUrl+(returnUrl.includes("?")?"&":"?")+"instagram="+(payload.success?"connected":"error"))}}catch{window.location.replace(returnUrl)}
          </script></body></html>`
          }

          async function handleOAuthCallback(_req: Request, url: URL) {
            const state = cleanText(url.searchParams.get("state"), 500)
            const code = cleanText(url.searchParams.get("code"), 5_000)
            const oauthError = cleanText(url.searchParams.get("error") || url.searchParams.get("error_reason"), 200)
            const fallbackUrl = `${PUBLIC_ORIGIN}/artist-dashboard/import/`
            if (!state) return htmlResponse(popupHtml({ kind: "invalid", returnUrl: fallbackUrl }), 400)

            const stateHash = await sha256Text(state)
            const claimStartedAt = new Date().toISOString()
            const staleBefore = new Date(Date.now() - OAUTH_PROCESSING_STALE_MS).toISOString()
            const { data: stored, error: claimError } = await admin
              .from("artist_instagram_oauth_states")
              .update({ processing_at: claimStartedAt })
              .eq("state_hash", stateHash)
              .is("used_at", null)
              .gt("expires_at", claimStartedAt)
              .or(`processing_at.is.null,processing_at.lt.${staleBefore}`)
              .select("id,artist_user_id,return_url,created_at,expires_at,used_at,processing_at")
              .maybeSingle()

            if (claimError) return htmlResponse(popupHtml({ kind: "failed", returnUrl: fallbackUrl }), 500)
            if (!stored) {
              const { data: existing } = await admin
                .from("artist_instagram_oauth_states")
                .select("id,artist_user_id,return_url,created_at,expires_at,used_at,processing_at")
                .eq("state_hash", stateHash)
                .maybeSingle()
              const returnUrl = existing?.return_url ? validateReturnUrl(existing.return_url) : fallbackUrl
              const kind: OAuthPopupKind = !existing
                ? "invalid"
                : existing.used_at
                  ? "consumed"
                  : Date.parse(existing.expires_at) <= Date.now()
                    ? "expired"
                    : "in_progress"
              if (existing?.artist_user_id) {
                const event = kind === "expired" ? "state_expired" : kind === "consumed" ? "state_already_consumed" : "state_in_progress"
                await logEvent(existing.artist_user_id, event, null)
              }
              return htmlResponse(popupHtml({ kind, returnUrl }), kind === "in_progress" ? 409 : 400)
            }

            const returnUrl = validateReturnUrl(stored.return_url)
            const stateAgeSeconds = Math.max(0, Math.round((Date.now() - Date.parse(stored.created_at)) / 1_000))
            await logEvent(stored.artist_user_id, "callback_received", null, 0, { state_age_seconds: stateAgeSeconds })

            if (oauthError || !code) {
              await admin.from("artist_instagram_oauth_states").update({
                used_at: new Date().toISOString(),
                processing_at: null,
                last_failure_category: "authorization_cancelled",
              }).eq("id", stored.id).is("used_at", null)
              await logEvent(stored.artist_user_id, "connection_cancelled", null, 0, { category: oauthError || "missing_code" })
              return htmlResponse(popupHtml({ kind: "cancelled", returnUrl }), 400)
            }

            try {
              if (!isConfigured()) throw new Error("instagram_not_configured")
              const short = await exchangeAuthorizationCode(code)
              await logEvent(stored.artist_user_id, "token_received", short.userId)
              if (short.permissions.length && !short.permissions.includes("instagram_business_basic")) throw new Error("instagram_basic_permission_missing")
              const long = await exchangeLongLivedToken(short.accessToken)
              const accessToken = long?.accessToken || short.accessToken
              const expiresIn = long?.expiresIn || short.expiresIn
              const profile = await profileFor(short.userId, accessToken)
              await logEvent(stored.artist_user_id, "profile_verified", profile.id || short.userId, 0, { account_type: profile.accountType })
              await saveConnection({
                artistUserId: stored.artist_user_id,
                instagramUserId: profile.id || short.userId,
                username: profile.username,
                accountType: profile.accountType,
                mediaCount: profile.mediaCount,
                accessToken,
                expiresIn,
                scopes: short.permissions,
              })
              const { error: consumeError } = await admin.from("artist_instagram_oauth_states").update({
                used_at: new Date().toISOString(),
                processing_at: null,
                last_failure_category: "",
              }).eq("id", stored.id).is("used_at", null)
              if (consumeError) throw new Error("instagram_state_consume_failed")
              return htmlResponse(popupHtml({ kind: "success", returnUrl, username: profile.username }))
            } catch (reason) {
              const category = errorCode(reason)
              await admin.from("artist_instagram_oauth_states").update({
                processing_at: null,
                last_failure_category: category,
              }).eq("id", stored.id).is("used_at", null)
              await admin.from("artist_instagram_connections").update({
                last_error_category: category,
                updated_at: new Date().toISOString(),
              }).eq("artist_user_id", stored.artist_user_id)
              const event = category.startsWith("instagram_code_exchange_") ? "code_exchange_failed" : "connection_failed"
              await logEvent(stored.artist_user_id, event, null, 0, { category, ...oauthDiagnostics(reason) })
              return htmlResponse(popupHtml({ kind: "failed", returnUrl }), 502)
            }
          }

          function normalizeCursor''',
              flags=re.S,
          )

          replace_once(
              edge_path,
              '''    const { error } = await admin.from("artist_instagram_oauth_states").insert({
                state_hash: stateHash,
                artist_user_id: user.id,
                return_url: returnUrl,
                requested_scopes: ["instagram_business_basic"],
              })''',
              '''    const { error } = await admin.from("artist_instagram_oauth_states").insert({
                state_hash: stateHash,
                artist_user_id: user.id,
                return_url: returnUrl,
                requested_scopes: ["instagram_business_basic"],
                expires_at: new Date(Date.now() + OAUTH_WINDOW_MS).toISOString(),
                processing_at: null,
                last_failure_category: "",
              })''',
          )

          client_path = "lib/kleio-instagram-import.ts"
          replace_once(
              client_path,
              '''  if (/code exchange failed|basic permission missing/.test(normalized)) {
                return "Instagram could not complete authorization. Confirm the Instagram App ID, App Secret, redirect URL, and basic permission in Meta."
              }
              if (/non-2xx|failed to send a request/.test(normalized)) return fallback
              return code || fallback''',
              '''  if (/redirect mismatch/.test(normalized)) return "Instagram connection is temporarily unavailable while KLEIO verifies its callback configuration."
              if (/invalid code/.test(normalized)) return "That Instagram authorization link is no longer valid. Start a fresh connection."
              if (/code exchange|basic permission missing/.test(normalized)) return "Instagram could not complete authorization. Return to KLEIO and start a fresh connection."
              if (/non-2xx|failed to send a request/.test(normalized)) return fallback
              return fallback''',
          )

          component_path = "components/kleio/instagram-import-assist.tsx"
          replace_once(
              component_path,
              'type OAuthMessage = { type?: string; success?: boolean; username?: string }',
              'type OAuthMessage = { type?: string; success?: boolean; username?: string; message?: string }',
          )
          replace_once(
              component_path,
              '''  const sessionIdRef = useRef(crypto.randomUUID())
            const lastSavedRef = useRef("")
            const hydratedRef = useRef(false)''',
              '''  const sessionIdRef = useRef(crypto.randomUUID())
            const lastSavedRef = useRef("")
            const hydratedRef = useRef(false)
            const oauthStartRef = useRef(false)
            const oauthPopupRef = useRef<Window | null>(null)
            const oauthMonitorRef = useRef<number | null>(null)
            const [oauthInProgress, setOauthInProgress] = useState(false)''',
          )
          replace_once(
              component_path,
              '''  useEffect(() => {
                function receive(event: MessageEvent<OAuthMessage>) {
                  if (event.origin !== callbackOrigin || event.data?.type !== "kleio-instagram-oauth") return
                  if (event.data.success) {
                    setNotice(`Instagram${event.data.username ? ` @${event.data.username}` : ""} is connected. Choose the posts you want to review.`)
                    setError("")
                    void refreshConnection(true)
                  } else {
                    setError("Instagram connection was not completed. Try again from this page.")
                  }
                }
                window.addEventListener("message", receive)
                return () => window.removeEventListener("message", receive)
              }, [])''',
              '''  useEffect(() => {
                function finishAttempt() {
                  oauthStartRef.current = false
                  oauthPopupRef.current = null
                  if (oauthMonitorRef.current !== null) window.clearInterval(oauthMonitorRef.current)
                  oauthMonitorRef.current = null
                  setOauthInProgress(false)
                }
                function receive(event: MessageEvent<OAuthMessage>) {
                  if (event.origin !== callbackOrigin || event.data?.type !== "kleio-instagram-oauth") return
                  finishAttempt()
                  if (event.data.success) {
                    setNotice(`Instagram${event.data.username ? ` @${event.data.username}` : ""} is connected. Choose the posts you want to review.`)
                    setError("")
                    void refreshConnection(true)
                    return
                  }
                  const callbackMessage = event.data.message === "instagram_oauth_expired"
                    ? "This Instagram connection attempt expired. Start a fresh connection."
                    : event.data.message === "instagram_oauth_cancelled"
                      ? "Instagram authorization was cancelled. Nothing was connected."
                      : event.data.message === "instagram_oauth_in_progress"
                        ? "An Instagram connection is already processing. Wait a moment and try again."
                        : "Instagram connection was not completed. Try again from this page."
                  setError(callbackMessage)
                }
                window.addEventListener("message", receive)
                return () => {
                  window.removeEventListener("message", receive)
                  if (oauthMonitorRef.current !== null) window.clearInterval(oauthMonitorRef.current)
                }
              }, [])''',
          )
          sub_once(
              component_path,
              r'  async function connect\(\) \{.*?\n  \}\n\n  async function refreshGallery',
              '''  async function connect() {
            if (working || oauthStartRef.current || oauthInProgress) {
              oauthPopupRef.current?.focus()
              return
            }
            oauthStartRef.current = true
            const popup = window.open("about:blank", "kleio-instagram-connect", "popup,width=620,height=760,resizable=yes,scrollbars=yes")
            if (!popup) {
              oauthStartRef.current = false
              return setError("Allow pop-ups for KLEIO, then try Connect Instagram again.")
            }
            oauthPopupRef.current = popup
            setOauthInProgress(true)
            setWorking("connect")
            setError("")
            setNotice("Opening Instagram’s secure authorization screen…")
            try {
              const { authorizeUrl } = await startInstagramConnection(window.location.href)
              popup.location.href = authorizeUrl
              popup.focus()
              oauthMonitorRef.current = window.setInterval(() => {
                if (!popup.closed) return
                if (oauthMonitorRef.current !== null) window.clearInterval(oauthMonitorRef.current)
                oauthMonitorRef.current = null
                oauthPopupRef.current = null
                oauthStartRef.current = false
                setOauthInProgress(false)
              }, 500)
            } catch (reason) {
              popup.close()
              oauthPopupRef.current = null
              oauthStartRef.current = false
              setOauthInProgress(false)
              setError(message(reason, "Instagram connection could not start."))
              setNotice("")
            } finally {
              setWorking("")
            }
          }

          async function refreshGallery''',
              flags=re.S,
          )
          replace_once(
              component_path,
              'disabled={Boolean(working) || connection?.configured === false} onClick={() => void connect()}>{working === "connect" ? <Loader2 className="size-4 animate-spin" /> : <Camera className="size-4" />}Connect Instagram',
              'disabled={Boolean(working) || oauthInProgress || connection?.configured === false} onClick={() => void connect()}>{working === "connect" || oauthInProgress ? <Loader2 className="size-4 animate-spin" /> : <Camera className="size-4" />}{oauthInProgress ? "Connecting Instagram…" : "Connect Instagram"}',
          )

          migration_path = "supabase/migrations/20260802010000_instagram_import.sql"
          replace_once(migration_path, "expires_at timestamptz not null default (now() + interval '10 minutes'),\n  used_at timestamptz", "expires_at timestamptz not null default (now() + interval '15 minutes'),\n  processing_at timestamptz,\n  last_failure_category text not null default '',\n  used_at timestamptz")

          Path("supabase/migrations/20260802070000_instagram_oauth_state_lifecycle.sql").write_text('''alter table public.artist_instagram_oauth_states
            add column if not exists processing_at timestamptz,
            add column if not exists last_failure_category text not null default '';

          alter table public.artist_instagram_oauth_states
            alter column expires_at set default (now() + interval '15 minutes');

          create index if not exists artist_instagram_oauth_states_processing_idx
            on public.artist_instagram_oauth_states (processing_at)
            where used_at is null;

          comment on column public.artist_instagram_oauth_states.processing_at is
            'Short-lived callback claim used to prevent concurrent processing without consuming the OAuth state.';
          comment on column public.artist_instagram_oauth_states.last_failure_category is
            'Safe normalized category from the most recent callback failure; never stores codes, tokens, state values, or secrets.';
          ''')

          audit_path = "scripts/audit-instagram-import.mjs"
          replace_once(audit_path, 'const migration = read("supabase/migrations/20260802010000_instagram_import.sql")', 'const migration = read("supabase/migrations/20260802010000_instagram_import.sql")\nconst oauthMigration = read("supabase/migrations/20260802070000_instagram_oauth_state_lifecycle.sql")')
          replace_once(audit_path, 'requireText(migration, /rights_confirmed_at/, "Instagram import must record rights confirmation.")', 'requireText(migration, /rights_confirmed_at/, "Instagram import must record rights confirmation.")\nrequireText(oauthMigration, /processing_at/, "OAuth callbacks must use an atomic processing claim.")\nrequireText(oauthMigration, /15 minutes/, "OAuth state lifetime must be explicit and consistent.")')
          replace_once(audit_path, 'requireText(edge, /state_hash/, "OAuth state hashing is missing.")', 'requireText(edge, /state_hash/, "OAuth state hashing is missing.")\nrequireText(edge, /htmlResponse/, "OAuth callback must return explicit HTML response headers.")\nrequireText(edge, /new FormData\\(\\)/, "Instagram code exchange must use form-data.")\nrequireText(edge, /instagram_code_exchange_redirect_mismatch/, "OAuth exchange errors must be normalized safely.")\nrequireText(edge, /processing_at/, "OAuth callback must claim state without consuming it early.")')
          replace_once(audit_path, 'forbidText(edge, /META_INSTAGRAM_APP_SECRET\\s*=\\s*["\'][^"\']+/, "A Meta secret appears committed.")', 'forbidText(edge, /META_INSTAGRAM_APP_SECRET\\s*=\\s*["\'][^"\']+/, "A Meta secret appears committed.")\nforbidText(edge, /raw\\.githubusercontent\\.com|queryBuilderPrototype|\\.catch\\(\\(\\) => undefined\\)/, "Production Instagram source must not depend on remote imports or runtime query-builder shims.")')
          replace_once(audit_path, 'requireText(component, /Disconnect/, "Disconnect control is missing.")', 'requireText(component, /Disconnect/, "Disconnect control is missing.")\nrequireText(component, /oauthStartRef/, "Duplicate Instagram connection attempts must be synchronously blocked.")\nrequireText(client, /return fallback/, "Unknown internal Instagram errors must use a safe artist-facing fallback.")')

          ci_path = ".github/workflows/ci.yml"
          replace_once(
              ci_path,
              '''      - name: Upload verification logs
                if: always()''',
              '''      - name: Audit Instagram import
                id: instagram_import
                continue-on-error: true
                shell: bash
