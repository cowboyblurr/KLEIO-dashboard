name: Visual Convenience

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "scripts/audit-visual-convenience.mjs"
      - "scripts/audit_visual_obstructions.py"
      - "package.json"
      - ".github/workflows/visual-convenience.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "scripts/audit-visual-convenience.mjs"
      - "scripts/audit_visual_obstructions.py"
      - "package.json"
      - ".github/workflows/visual-convenience.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inventory every interface surface
        run: python scripts/audit_visual_obstructions.py
      - run: pnpm audit:visual-convenience
      - run: pnpm audit:gemini-document-intelligence
      - run: pnpm typecheck
      - run: pnpm build
