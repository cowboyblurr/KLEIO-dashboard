name: Apply document relevance and schema compatibility layer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/gemini-document-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-document-intelligence
          fetch-depth: 0
      - name: Apply relevance, synopsis and provider-schema fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Expected at least {count} occurrence(s) in {path}, found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          shared = "supabase/functions/_shared/gemini-document-intelligence.ts"
          replace(shared,
          '  analysis_summary: { what_was_found: string[]; what_was_not_found: string[]; what_needs_review: string[]; coverage_level: string; coverage_explanation: string }',
          '''  analysis_summary: {
    document_synopsis: string
    relevance: "highly_relevant" | "partially_relevant" | "not_relevant" | "requires_artist_review"
    relevance_explanation: string
    extractable_information: Array<{ category: string; approximate_items: number; confidence: number; passport_or_application_use: string }>
    recommended_use: string[]
    what_was_found: string[]
    what_was_not_found: string[]
    what_needs_review: string[]
    coverage_level: string
    coverage_explanation: string
  }''')

          replace(shared,
          '''function supportedJsonSchema(value: unknown): unknown {
  if (Array.isArray(value)) return value.map(supportedJsonSchema)
  if (!object(value)) return value
  const supported = new Set(["$id", "$defs", "$ref", "$anchor", "type", "format", "title", "description", "enum", "items", "prefixItems", "minItems", "maxItems", "minimum", "maximum", "anyOf", "oneOf", "properties", "additionalProperties", "required", "propertyOrdering"])
  const next: JsonObject = {}
  for (const [key, item] of Object.entries(value)) if (supported.has(key)) next[key] = supportedJsonSchema(item)
  return next
}''',
          '''function supportedJsonSchema(value: unknown): unknown {
  if (Array.isArray(value)) return value.map(supportedJsonSchema)
  if (!object(value)) return value
  const supported = new Set(["type", "format", "title", "description", "enum", "items", "properties", "required", "propertyOrdering"])
  const next: JsonObject = {}
  for (const [key, item] of Object.entries(value)) {
    if (!supported.has(key)) continue
    if (key === "type" && Array.isArray(item)) {
      next.type = item.find((candidate) => candidate !== "null") || "string"
      continue
    }
    next[key] = supportedJsonSchema(item)
  }
  return next
}''')

          replace(shared,
          '''      analysis_summary: { type: "object", additionalProperties: false, required: ["what_was_found", "what_was_not_found", "what_needs_review", "coverage_level", "coverage_explanation"], properties: { what_was_found: stringArray, what_was_not_found: stringArray, what_needs_review: stringArray, coverage_level: { type: "string" }, coverage_explanation: { type: "string" } } },''',
          '''      analysis_summary: { type: "object", additionalProperties: false, required: ["document_synopsis", "relevance", "relevance_explanation", "extractable_information", "recommended_use", "what_was_found", "what_was_not_found", "what_needs_review", "coverage_level", "coverage_explanation"], properties: { document_synopsis: { type: "string" }, relevance: { type: "string", enum: ["highly_relevant", "partially_relevant", "not_relevant", "requires_artist_review"] }, relevance_explanation: { type: "string" }, extractable_information: { type: "array", items: { type: "object", additionalProperties: false, required: ["category", "approximate_items", "confidence", "passport_or_application_use"], properties: { category: { type: "string" }, approximate_items: { type: "integer" }, confidence: { type: "number" }, passport_or_application_use: { type: "string" } } } }, recommended_use: stringArray, what_was_found: stringArray, what_was_not_found: stringArray, what_needs_review: stringArray, coverage_level: { type: "string" }, coverage_explanation: { type: "string" } } },''')

          replace(shared,
          '  const assessment = raw.document_assessment\n',
          '''  const assessment = raw.document_assessment
  const rawSummary = object(raw.analysis_summary) ? raw.analysis_summary : {}
  const relevance = ["highly_relevant", "partially_relevant", "not_relevant", "requires_artist_review"].includes(String(rawSummary.relevance))
    ? String(rawSummary.relevance) as GeminiDocumentAnalysis["analysis_summary"]["relevance"]
    : "requires_artist_review"
''')

          replace(shared,
          '    sections, claims, unresolved_content: unresolved,\n    analysis_summary: { what_was_found:',
          '    sections, claims: relevance === "not_relevant" ? [] : claims, unresolved_content: unresolved,\n    analysis_summary: { document_synopsis: cleanText(rawSummary.document_synopsis, 2_000), relevance, relevance_explanation: cleanText(rawSummary.relevance_explanation, 2_000), extractable_information: (Array.isArray(rawSummary.extractable_information) ? rawSummary.extractable_information : []).filter(object).map((item) => ({ category: cleanText(item.category, 200), approximate_items: Math.max(0, Math.min(500, Number(item.approximate_items) || 0)), confidence: Math.max(0, Math.min(1, Number(item.confidence) || 0)), passport_or_application_use: cleanText(item.passport_or_application_use, 1_000) })).filter((item) => item.category).slice(0, 40), recommended_use: (Array.isArray(rawSummary.recommended_use) ? rawSummary.recommended_use : []).map((value) => cleanText(value, 500)).filter(Boolean).slice(0, 20), what_was_found:')

          replace(shared,
          'export function assessDocumentCoverage(input: { classification: string; totalPages: number; pagesAnalyzed: number[]; unreadablePages: number[]; claims: Array<{ claim_type: string; confidence: number; information_layer: string }>; sections: Array<{ section_type: string }>; providerAvailable: boolean; textQuality: string }): { quality: DocumentQuality; explanation: string; score: number } {\n  if (!input.providerAvailable)',
          'export function assessDocumentCoverage(input: { classification: string; totalPages: number; pagesAnalyzed: number[]; unreadablePages: number[]; claims: Array<{ claim_type: string; confidence: number; information_layer: string }>; sections: Array<{ section_type: string }>; providerAvailable: boolean; relevance?: string; textQuality: string }): { quality: DocumentQuality; explanation: string; score: number } {\n  if (!input.providerAvailable)')

          replace(shared,
          '  if (["needs_artist_classification", "unknown_document"].includes(input.classification)) return { quality: "classification_required", explanation: "KLEIO needs the artist to confirm the document type before applying document-specific interpretation.", score: 0.25 }\n',
          '''  if (input.relevance === "not_relevant") return { quality: "complete_review_ready", explanation: "Gemini reviewed the complete document and determined that it is not relevant for populating this artist's Creative Passport or application materials. KLEIO preserved the synopsis and relevance explanation without creating Passport proposals.", score: 1 }
  if (["needs_artist_classification", "unknown_document"].includes(input.classification) && input.relevance === "requires_artist_review") return { quality: "classification_required", explanation: "KLEIO needs the artist to confirm the document type before applying document-specific interpretation.", score: 0.25 }
''')

          replace(shared,
          'Understand layout, columns, headings, tables, images, captions, chronology, and relationships across pages. Extract only information supported by the PDF.',
          'Understand layout, columns, headings, tables, images, captions, chronology, and relationships across pages. First identify what the document actually is, summarize it concisely, assess whether it is relevant to an artist Creative Passport or opportunity application, explain that relevance, and name the categories of information it can safely support. Extract only information supported by the PDF.')

          replace(shared,
          'Protocol:\\n1. Perceive every page, including scanned and visually structured content.\\n2. Map sections and reading order.\\n3. Extract source-supported Creative Passport proposals.',
          'Protocol:\\n1. Perceive every page, including scanned and visually structured content.\\n2. Identify the actual document type independently of the artist-selected label.\\nn3. Write a concise document synopsis and assess relevance to the Creative Passport or an opportunity application.\\n4. Explain which information categories are extractable and their appropriate use.\\n5. Map sections and reading order.\\n6. Extract source-supported Creative Passport proposals only when the document is relevant.')

          # Correct the escaped newline marker introduced above while retaining numbered protocol steps.
          p = Path(shared)
          p.write_text(p.read_text().replace('\\\\n3. Write a concise', '\\\\n3. Write a concise'))

          extractor = "supabase/functions/extract-artist-materials/index.ts"
          replace(extractor,
          'providerAvailable: true, textQuality: analysis.document_assessment.text_quality',
          'providerAvailable: true, relevance: analysis.analysis_summary.relevance, textQuality: analysis.document_assessment.text_quality',
          1)
          replace(extractor,
          'providerAvailable: true, textQuality: next.document_assessment.text_quality',
          'providerAvailable: true, relevance: next.analysis_summary.relevance, textQuality: next.document_assessment.text_quality',
          1)

          component = "components/kleio/artist-document-intelligence.tsx"
          replace(component,
          '''  analysis_summary?: {
    what_was_found?: string[]
    what_was_not_found?: string[]
    what_needs_review?: string[]
    coverage_level?: string
    coverage_explanation?: string
  }''',
          '''  analysis_summary?: {
    document_synopsis?: string
    relevance?: "highly_relevant" | "partially_relevant" | "not_relevant" | "requires_artist_review"
    relevance_explanation?: string
    extractable_information?: Array<{
      category?: string
      approximate_items?: number
      confidence?: number
      passport_or_application_use?: string
    }>
    recommended_use?: string[]
    what_was_found?: string[]
    what_was_not_found?: string[]
    what_needs_review?: string[]
    coverage_level?: string
    coverage_explanation?: string
  }''')

          replace(component,
          '  const assessment = result.summary.document_assessment ?? {}\n',
          '  const assessment = result.summary.document_assessment ?? {}\n  const insight = result.summary.analysis_summary ?? {}\n')

          replace(component,
          '<div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-6">',
          '<div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-7">')
          replace(component,
          '            ["Document type", assessment.document_type ? titleCase(assessment.document_type) : "Needs review"],\n            ["Pages perceived",',
          '            ["Document type", assessment.document_type ? titleCase(assessment.document_type) : "Needs review"],\n            ["Relevance", insight.relevance ? titleCase(insight.relevance) : "Needs review"],\n            ["Pages perceived",')

          insert_point = '      <div className="space-y-5 p-5 sm:p-6">\n        <div className={`rounded-2xl border p-4 text-sm leading-6 ${qualityTone(result.summary.analysis_quality)}`}> '
          if insert_point not in Path(component).read_text():
              # Match the exact current line without a trailing space.
              insert_point = '      <div className="space-y-5 p-5 sm:p-6">\n        <div className={`rounded-2xl border p-4 text-sm leading-6 ${qualityTone(result.summary.analysis_quality)}`}> '
          text = Path(component).read_text()
          target = '      <div className="space-y-5 p-5 sm:p-6">\n        <div className={`rounded-2xl border p-4 text-sm leading-6 ${qualityTone(result.summary.analysis_quality)}`}>\n'
          if target not in text:
              raise SystemExit("Could not locate analysis result body insertion point")
          relevance_ui = '''      <div className="space-y-5 p-5 sm:p-6">
        {(insight.document_synopsis || insight.relevance_explanation) && (
          <section className="rounded-2xl border border-[#D8D0F2] bg-[#FCFBFE] p-4 sm:p-5" aria-labelledby="document-synopsis-title">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <h3 id="document-synopsis-title" className="font-serif text-xl font-semibold text-[#292631]">What this document is</h3>
              {insight.relevance && <span className={`rounded-full border px-3 py-1 text-xs font-semibold ${insight.relevance === "not_relevant" ? "border-amber-200 bg-amber-50 text-amber-900" : insight.relevance === "highly_relevant" ? "border-emerald-200 bg-emerald-50 text-emerald-800" : "border-[#D8D0F2] bg-white text-[#625C70]"}`}>{titleCase(insight.relevance)}</span>}
            </div>
            {insight.document_synopsis && <p className="mt-3 text-sm leading-7 text-[#4B4654]">{insight.document_synopsis}</p>}
            {insight.relevance_explanation && <p className="mt-3 text-sm leading-7 text-[#746E80]">{insight.relevance_explanation}</p>}
          </section>
        )}

        {(insight.extractable_information?.length ?? 0) > 0 && (
          <section>
            <h3 className="font-serif text-xl font-semibold text-[#292631]">Information KLEIO can audit</h3>
            <p className="mt-1 text-sm leading-6 text-[#746E80]">These categories describe what the document can support. Only page-backed, artist-reviewed items become Passport proposals.</p>
            <div className="mt-3 grid gap-3 sm:grid-cols-2">
              {insight.extractable_information?.slice(0, 10).map((item, index) => (
                <article key={`${item.category}-${index}`} className="rounded-2xl border border-[#E7E1F7] bg-white p-4">
                  <div className="flex items-start justify-between gap-3">
                    <p className="text-sm font-semibold text-[#292631]">{item.category || "Document information"}</p>
                    {typeof item.confidence === "number" && <span className="text-xs font-semibold text-[#75639E]">{Math.round(item.confidence * 100)}%</span>}
                  </div>
                  <p className="mt-2 text-xs leading-5 text-[#746E80]">{item.passport_or_application_use || "Artist review required before use."}</p>
                  {typeof item.approximate_items === "number" && <p className="mt-2 text-[0.68rem] font-semibold uppercase tracking-wide text-[#8A8296]">About {item.approximate_items} supported item{item.approximate_items === 1 ? "" : "s"}</p>}
                </article>
              ))}
            </div>
          </section>
        )}

        {(insight.recommended_use?.length ?? 0) > 0 && (
          <section className="rounded-2xl border border-[#E7E1F7] bg-white p-4">
            <h3 className="text-sm font-semibold text-[#292631]">Recommended use</h3>
            <ul className="mt-2 space-y-2 text-sm leading-6 text-[#746E80]">{insight.recommended_use?.map((item, index) => <li key={index}>• {item}</li>)}</ul>
          </section>
        )}

        <div className={`rounded-2xl border p-4 text-sm leading-6 ${qualityTone(result.summary.analysis_quality)}`}>
'''
          Path(component).write_text(text.replace(target, relevance_ui, 1))

          tests = "tests/gemini-document-intelligence.test.mjs"
          replace(tests,
          'function assess({ classification, totalPages, pagesAnalyzed, unreadablePages = [], claims, sections, providerAvailable = true, textQuality = "native_text" }) {\n  if (!providerAvailable) return "provider_unavailable"',
          'function assess({ classification, totalPages, pagesAnalyzed, unreadablePages = [], claims, sections, providerAvailable = true, relevance = "highly_relevant", textQuality = "native_text" }) {\n  if (!providerAvailable) return "provider_unavailable"\n  if (relevance === "not_relevant") return "complete_review_ready"')
          p = Path(tests)
          p.write_text(p.read_text() + '''

test("fully reviewed non-artist document is complete without Passport proposals", () => {
  assert.equal(assess({ classification: "artist_cv", totalPages: 8, pagesAnalyzed: [1,2,3,4,5,6,7,8], claims: [], sections: ["overview", "features"], relevance: "not_relevant" }), "complete_review_ready")
})
''')

          audit = "scripts/audit-gemini-document-intelligence.mjs"
          p = Path(audit)
          text = p.read_text()
          marker = 'console.log('
          addition = '''requireText(shared, "document_synopsis", "Gemini analysis must return a document synopsis")
requireText(shared, "not_relevant", "Gemini analysis must classify document relevance")
requireText(shared, "extractable_information", "Gemini analysis must explain auditable information categories")
requireText(shared, "supportedJsonSchema", "Gemini requests must use a provider-compatible schema subset")
requireText(extractor, "analysis_summary.relevance", "coverage must account for relevance rather than proposal count alone")
requireText(component, "What this document is", "the upload page must show a synopsis immediately")
requireText(component, "Information KLEIO can audit", "the upload page must show extractable information categories")
'''
          if addition not in text:
              text = text.replace(marker, addition + "\n" + marker, 1)
              p.write_text(text)

          PY
          git config user.name "KLEIO GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/_shared/gemini-document-intelligence.ts supabase/functions/extract-artist-materials/index.ts components/kleio/artist-document-intelligence.tsx tests/gemini-document-intelligence.test.mjs scripts/audit-gemini-document-intelligence.mjs
          git commit -m "Add document synopsis, relevance and Gemini schema compatibility"
          git push origin HEAD:agent/gemini-document-intelligence
