name: Apply Instagram completion relay

on:
  push:
    branches:
      - fix/instagram-oauth-state-and-callback
    paths:
      - .github/workflows/apply-instagram-completion-relay.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Route OAuth return to minimal completion page
        shell: python
        run: |
          from pathlib import Path

          component_path = Path("components/kleio/instagram-import-assist.tsx")
          component = component_path.read_text()
          old = 'const { authorizeUrl } = await startInstagramConnection(window.location.href)'
          new = '''const completionUrl = new URL("/artist-dashboard/import/instagram-complete/", window.location.origin)
              const { authorizeUrl } = await startInstagramConnection(completionUrl.href)'''
          if old not in component:
              raise SystemExit("Instagram start return URL target not found")
          component_path.write_text(component.replace(old, new, 1))

          audit_path = Path("scripts/audit-instagram-import.mjs")
          audit = audit_path.read_text()
          read_marker = 'const page = read("components/kleio/artist-import-studio-page.tsx")'
          read_replacement = '''const page = read("components/kleio/artist-import-studio-page.tsx")
          const completionPage = read("app/artist-dashboard/import/instagram-complete/page.tsx")'''
          if read_marker not in audit:
              raise SystemExit("Instagram audit read marker not found")
          audit = audit.replace(read_marker, read_replacement, 1)

          assertion_marker = 'requireText(component, /instagram_oauth_consumed/, "Replayed Instagram callbacks need a clear artist-facing message.")'
          assertion_replacement = '''requireText(component, /instagram_oauth_consumed/, "Replayed Instagram callbacks need a clear artist-facing message.")
          requireText(component, /artist-dashboard\\/import\\/instagram-complete/, "OAuth must return through the minimal completion relay, not the full Import Studio.")
          requireText(completionPage, /window\\.opener\\.postMessage/, "The completion relay must notify the original Import Studio window.")
          requireText(completionPage, /window\\.close/, "The completion relay must attempt to close the authorization popup.")
          requireText(completionPage, /Your Instagram gallery is opening in the original KLEIO window/, "The completion relay fallback copy is missing.")'''
          if assertion_marker not in audit:
              raise SystemExit("Instagram audit assertion marker not found")
          audit_path.write_text(audit.replace(assertion_marker, assertion_replacement, 1))

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Instagram audit
        run: pnpm audit:instagram-import

      - name: Production build
        run: pnpm build

      - name: Commit verified relay and remove runner
        run: |
          git config user.name "KLEIO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/instagram-import-assist.tsx scripts/audit-instagram-import.mjs app/artist-dashboard/import/instagram-complete/page.tsx
          git rm .github/workflows/apply-instagram-completion-relay.yml
          git commit -m "Return Instagram authorization to original gallery"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
