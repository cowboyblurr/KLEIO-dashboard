name: Passport Review Live

on:
  push:
    branches: ["main"]
    paths:
      - "components/kleio/passport-updates-inbox.tsx"
      - "app/artist-dashboard/passport/review/**"
      - "scripts/audit-gemini-document-intelligence.mjs"
      - ".github/workflows/passport-review-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: passport-review-live
  cancel-in-progress: true

env:
  REVIEW_URL: https://www.kleioarthouse.com/artist-dashboard/passport/review/

jobs:
  verify:
    name: Verify compact review in production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Publish pending verification status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state "pending" \
            --arg target_url "$RUN_URL" \
            --arg description "Waiting for compact Passport review deployment" \
            --arg context "KLEIO Passport Review Live" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"

      - name: Wait for the compact Passport review to be live
        id: live_check
        shell: bash
        run: |
          set -euo pipefail
          route_html="$(mktemp)"
          combined_bundle="$(mktemp)"
          success="false"

          for attempt in $(seq 1 90); do
            : > "$route_html"
            : > "$combined_bundle"

            status="$(curl --silent --show-error --location --output "$route_html" --write-out '%{http_code}' --max-time 30 "${REVIEW_URL}?verification=${GITHUB_SHA}" || true)"

            if [ "$status" = "200" ] && grep -Fq "<title>KLEIO — Passport Updates for Review</title>" "$route_html"; then
              script_count=0
              while IFS= read -r src; do
                [ -n "$src" ] || continue
                script_count=$((script_count + 1))
                curl --silent --show-error --location --fail --max-time 30 "https://www.kleioarthouse.com${src}?verification=${GITHUB_SHA}" >> "$combined_bundle"
              done < <(grep -oE 'src="[^"]+\.js"' "$route_html" | cut -d'"' -f2 | sort -u)

              if [ "$script_count" -gt 0 ] \
                && grep -Fq "Scan each suggestion, expand the evidence only when needed, and edit only before approval." "$combined_bundle" \
                && grep -Fq "Approve safe facts" "$combined_bundle" \
                && ! grep -Fq "Most suggestions now appear directly in the matching Passport field." "$combined_bundle"; then
                echo "Verified the compact Passport approval review at ${REVIEW_URL}."
                success="true"
                break
              fi
            fi

            echo "Waiting for the compact review deployment (attempt ${attempt}/90, HTTP ${status})..."
            sleep 10
          done

          if [ "$success" != "true" ]; then
            echo "The compact Passport review was not verified in production before timeout."
            exit 1
          fi

      - name: Publish final verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live_check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            state="success"
            description="Compact Passport review verified live"
          else
            state="failure"
            description="Compact Passport live verification failed"
          fi

          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "$RUN_URL" \
            --arg description "$description" \
            --arg context "KLEIO Passport Review Live" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
