name: Apply verified Gemini structured-output fix

on:
  push:
    branches:
      - fix/gemini-36-structured-schema-20260808
    paths:
      - .github/workflows/fix-gemini-structured-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shared Gemini adapter from verified provider probe
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/_shared/gemini-document-intelligence.ts")
          text = path.read_text()

          old_schema = '''function supportedJsonSchema(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(supportedJsonSchema)
            if (!object(value)) return value
            const supported = new Set(["type", "format", "title", "description", "enum", "items", "properties", "required", "propertyOrdering"])
            const next: JsonObject = {}
            for (const [key, item] of Object.entries(value)) {
              if (!supported.has(key)) continue
              if (key === "type" && Array.isArray(item)) {
                next.type = item.find((candidate) => candidate !== "null") || "string"
                continue
              }
              next[key] = supportedJsonSchema(item)
            }
            return next
          }'''
          new_schema = '''export function supportedJsonSchema(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(supportedJsonSchema)
            if (!object(value)) return value
            const supported = new Set(["type", "format", "title", "description", "enum", "items", "properties", "required", "propertyOrdering"])
            const next: JsonObject = {}
            for (const [key, item] of Object.entries(value)) {
              if (!supported.has(key)) continue
              if (key === "type" && Array.isArray(item)) {
                next.type = item.find((candidate) => candidate !== "null") || "string"
                continue
              }
              if (key === "properties" && object(item)) {
                next.properties = Object.fromEntries(
                  Object.entries(item).map(([name, schema]) => [name, supportedJsonSchema(schema)]),
                )
                continue
              }
              next[key] = supportedJsonSchema(item)
            }
            return next
          }'''
          if old_schema not in text:
            raise SystemExit("Expected supportedJsonSchema block not found; refusing broad edit")
          text = text.replace(old_schema, new_schema, 1)

          old_config = '? { responseFormat: { text: { mimeType: "application/json", schema } }, maxOutputTokens: input.maxOutputTokens ?? 32_768 }'
          new_config = '? { responseFormat: { text: { mimeType: "APPLICATION_JSON", schema } }, maxOutputTokens: input.maxOutputTokens ?? 32_768 }'
          if old_config not in text:
            raise SystemExit("Expected Gemini 3 responseFormat block not found; refusing broad edit")
          text = text.replace(old_config, new_config, 1)

          path.write_text(text)

          audit = Path("scripts/audit-passport-synthesis-orchestration.mjs")
          audit_text = audit.read_text()
          marker = 'const usageMigration = read("supabase/migrations/20260808132600_add_document_profile_synthesis_usage_action.sql")\n'
          addition = marker + 'const geminiAdapter = read("supabase/functions/_shared/gemini-document-intelligence.ts")\n'
          if marker not in audit_text:
            raise SystemExit("Passport audit insertion marker missing")
          audit_text = audit_text.replace(marker, addition, 1)
          checks_marker = 'requireText(usageMigration, /synthesize_document_profile/, "The production usage constraint must permit document-profile synthesis diagnostics.")\n'
          checks = checks_marker + '''requireText(geminiAdapter, /key === "properties"[\\s\\S]*Object\\.entries\\(item\\)[\\s\\S]*supportedJsonSchema\\(schema\\)/, "Gemini schema sanitization must preserve named object properties while filtering each nested schema.")
          requireText(geminiAdapter, /mimeType:\\s*"APPLICATION_JSON"/, "Gemini 3 structured output must use the current TextResponseFormat MIME enum.")
          forbidText(geminiAdapter, /responseFormat:[\\s\\S]{0,120}mimeType:\\s*"application\\/json"/, "Gemini 3 responseFormat must not send the legacy MIME string rejected by the current API.")
          '''
          if checks_marker not in audit_text:
            raise SystemExit("Passport audit check marker missing")
          audit.write_text(audit_text.replace(checks_marker, checks, 1))

          assert 'mimeType: "APPLICATION_JSON"' in text
          assert 'key === "properties"' in text
          assert 'Object.entries(item).map(([name, schema])' in text
      - name: Run targeted Passport orchestration audit
        run: node scripts/audit-passport-synthesis-orchestration.mjs
      - name: Commit verified fix and remove temporary patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-gemini-structured-contract.yml
          git add supabase/functions/_shared/gemini-document-intelligence.ts scripts/audit-passport-synthesis-orchestration.mjs
          git commit -m "Fix Gemini 3 structured output schema contract"
          git push origin HEAD:fix/gemini-36-structured-schema-20260808
