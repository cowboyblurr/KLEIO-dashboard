name: Verify KLEIO Live Production

on:
  workflow_run:
    workflows: ["Deploy KLEIO Dashboard to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live:
    if: ${{ github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.kleioarthouse.com
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

    steps:
      - name: Publish Pages deploy result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DEPLOY_CONCLUSION}" = "success" ]; then
            state="success"
            description="GitHub Pages deploy workflow completed"
          else
            state="failure"
            description="GitHub Pages deploy workflow failed"
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"KLEIO Pages Deploy\",\"description\":\"%s\",\"target_url\":\"https://www.kleioarthouse.com\"}' "$state" "$description")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "$payload"

      - name: Verify current production surface and artist image upload bundles
        id: live_verify
        if: env.DEPLOY_CONCLUSION == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          SITE_ORIGIN="$(printf '%s' "$SITE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"

          fetch_route_bundle() {
            route="$1"
            output="$2"
            html="$(mktemp)"
            curl --silent --show-error --location --fail --max-time 30 "${SITE_URL}${route}?live_upload_verification=${TARGET_SHA}" > "$html"
            : > "$output"
            count=0
            while IFS= read -r src; do
              [ -n "$src" ] || continue
              count=$((count + 1))
              curl --silent --show-error --location --fail --max-time 30 "${SITE_ORIGIN}${src}?live_upload_verification=${TARGET_SHA}" >> "$output"
            done < <(grep -oE 'src="[^"]+\.js"' "$html" | cut -d'"' -f2 | sort -u)
            test "$count" -gt 0
            test -s "$output"
          }

          verified="false"
          for attempt in $(seq 1 24); do
            home="$(mktemp)"
            portfolio_bundle="$(mktemp)"
            passport_bundle="$(mktemp)"

            home_status="$(curl --silent --show-error --location --output "$home" --write-out '%{http_code}' --max-time 30 "${SITE_URL}/?live_upload_verification=${TARGET_SHA}" || true)"
            if [ "$home_status" = "200" ] && grep -Fq "Less administration. More clarity to create, apply, and decide." "$home"; then
              if fetch_route_bundle "/artist-dashboard/portfolio/" "$portfolio_bundle" \
                && fetch_route_bundle "/artist-dashboard/passport/" "$passport_bundle" \
                && grep -Fq "Upload from device" "$portfolio_bundle" \
                && grep -Fq "image/jpeg" "$portfolio_bundle" \
                && grep -Fq "image/png" "$portfolio_bundle" \
                && grep -Fq "image/webp" "$portfolio_bundle" \
                && grep -Fq "Profile photo" "$passport_bundle" \
                && grep -Fq "image/jpeg" "$passport_bundle" \
                && grep -Fq "image/png" "$passport_bundle" \
                && grep -Fq "image/webp" "$passport_bundle"; then
                echo "Verified current KLEIO landing surface and live artist image-upload controls for ${TARGET_SHA}."
                verified="true"
                break
              fi
            fi

            echo "Live domain has not reached the current artist-upload build yet (attempt ${attempt}/24)."
            sleep 5
          done

          test "$verified" = "true"

      - name: Publish artist upload live result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DEPLOY_CONCLUSION}" = "success" ] && [ "${LIVE_OUTCOME}" = "success" ]; then
            state="success"
            description="Live Portfolio and Passport accept JPEG, PNG, and WEBP"
          else
            state="failure"
            description="Live artist image-upload surface is not verified"
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"KLEIO Artist Upload Live\",\"description\":\"%s\",\"target_url\":\"https://www.kleioarthouse.com\"}' "$state" "$description")"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "$payload"

          test "$state" = "success"
