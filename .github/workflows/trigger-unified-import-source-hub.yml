name: Verify unified Import Studio source hub

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply focused source-hub patch
        shell: bash
        run: |
          python - <<'RUN'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-unified-import-source-hub.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = workflow[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in code.splitlines())
          exec(compile(code, 'apply-unified-import-source-hub.py', 'exec'))
          RUN
          rm -f .github/workflows/trigger-unified-import-source-hub.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused importer audits
        run: |
          pnpm audit:artist-import
          pnpm audit:universal-media
          pnpm audit:website-import
          pnpm audit:instagram-import
          pnpm audit:import-sources

      - name: Run project validation
        run: |
          pnpm typecheck
          pnpm lint
          pnpm build

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Import Studio source hub" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
