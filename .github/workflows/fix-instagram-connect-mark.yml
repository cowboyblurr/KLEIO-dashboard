name: Fix Instagram connect mark

on:
  push:
    branches:
      - fix/instagram-oauth-state-and-callback
    paths:
      - .github/workflows/fix-instagram-connect-mark.yml

permissions:
  contents: write

jobs:
  patch-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Use local connection mark everywhere
        shell: python
        run: |
          from pathlib import Path
          path = Path("components/kleio/instagram-import-assist.tsx")
          source = path.read_text()
          target = '<Instagram className="size-4" />'
          if target not in source:
              raise SystemExit("Connect icon target not found")
          source = source.replace(target, '<InstagramMark />')
          if "<Instagram " in source:
              raise SystemExit("Unsupported Instagram component remains")
          path.write_text(source)

      - name: Commit icon fix
        run: |
          git config user.name "KLEIO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/instagram-import-assist.tsx
          git rm .github/workflows/fix-instagram-connect-mark.yml
          git commit -m "Use local mark in Instagram connect action"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
