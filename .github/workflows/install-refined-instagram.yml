name: Install refined Instagram OAuth source

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/instagram-oauth-state-and-callback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Restore reviewed source files
        shell: bash
        run: |
          cat .instagram-repair/edge.part1 .instagram-repair/edge.part2 .instagram-repair/edge.part3 | base64 --decode | gzip --decompress > supabase/functions/instagram-import/index.ts
          cat .instagram-repair/client.part1 | base64 --decode | gzip --decompress > lib/kleio-instagram-import.ts
          cat .instagram-repair/component.part1 .instagram-repair/component.part2 | base64 --decode | gzip --decompress > components/kleio/instagram-import-assist.tsx

      - name: Commit refined product source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/instagram-import/index.ts lib/kleio-instagram-import.ts components/kleio/instagram-import-assist.tsx
          git commit -m "Refine Instagram OAuth state claim and retry semantics"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
