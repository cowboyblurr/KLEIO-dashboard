name: Repair GitHub Pages Publishing Source

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pages: write

jobs:
  repair-pages-source:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type, html_url, cname, source}' | tee pages-site.json
          test "$(jq -r '.build_type' pages-site.json)" = "workflow"

      - name: Inspect recent production workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?event=push&branch=main&per_page=10" \
            --jq '{runs: [.workflow_runs[] | {id, head_sha, status, conclusion, run_number, created_at, updated_at, html_url}]}' \
            | tee pages-workflow-runs.json

      - name: Inspect GitHub Pages deployment history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" \
            --jq '{deployments: [.[] | {id, sha, ref, environment, created_at, updated_at, statuses_url}]}' \
            | tee pages-deployments.json

      - name: Inspect latest legacy Pages build record
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            --jq '{status, commit, created_at, updated_at, error}' \
            | tee pages-latest-build.json

      - name: Upload Pages source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-source-evidence
          path: |
            pages-site.json
            pages-workflow-runs.json
            pages-deployments.json
            pages-latest-build.json
          if-no-files-found: warn
