name: Remove product walkthrough copy

on:
  push:
    branches:
      - fix/remove-product-walkthrough-copy
    paths:
      - .github/workflows/cleanup-product-walkthrough-copy.yml

permissions:
  contents: write

concurrency:
  group: kleio-product-copy-cleanup
  cancel-in-progress: false

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove persistent walkthrough copy
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          function replaceOnce(source, search, replacement, label) {
            const first = source.indexOf(search)
            if (first < 0) throw new Error(`Missing target: ${label}`)
            if (source.indexOf(search, first + search.length) >= 0) throw new Error(`Target is not unique: ${label}`)
            return source.slice(0, first) + replacement + source.slice(first + search.length)
          }

          function update(path, transform) {
            const before = fs.readFileSync(path, "utf8")
            const after = transform(before)
            if (after === before) throw new Error(`${path} did not change`)
            fs.writeFileSync(path, after)
          }

          update("components/kleio/production-artist-opportunity-directory.tsx", (source) => {
            let next = replaceOnce(
              source,
              'import { ExpandableInfo, InlineHelper, TrustIndicator } from "@/components/kleio/guidance-system"\n',
              "",
              "production opportunity guidance import",
            )
            next = replaceOnce(
              next,
              '<WorkspacePageHeader eyebrow="Artist workspace" title="Opportunities" description="Search worldwide sourced opportunity records. Refine only when needed; KLEIO shows readiness only when application requirements are structured." />',
              '<WorkspacePageHeader eyebrow="Artist workspace" title="Opportunities" description="Search sourced artist opportunities by medium, location, type, or format." />',
              "production opportunity page description",
            )
            next = replaceOnce(
              next,
              `            <div className="mt-2 flex flex-wrap items-center justify-between gap-3">\n              <p className="text-xs leading-relaxed text-muted-foreground">Search naturally. KLEIO never invents a listing to satisfy a query.</p>\n              <button type="button" className={secondary} onClick={() => setFiltersOpen((current) => !current)} aria-expanded={filtersOpen} aria-controls="opportunity-refinement-controls">`,
              `            <div className="mt-2 flex justify-end">\n              <button type="button" className={secondary} onClick={() => setFiltersOpen((current) => !current)} aria-expanded={filtersOpen} aria-controls="opportunity-refinement-controls">`,
              "production opportunity search helper",
            )
            next = replaceOnce(
              next,
              `{intent.hasStructuredIntent && <section className="px-1" aria-label="Interpreted search terms"><div className="flex flex-wrap items-center gap-2"><p className="mr-1 text-[0.68rem] font-semibold uppercase tracking-wide text-[#625C70]">KLEIO understood</p>{intent.chips.map((chip) => <span key={chip.key} className="rounded-full bg-[#F7F4FF] px-2.5 py-1 text-xs font-semibold text-[#5B4B8A]">{chip.label}</span>)}</div><InlineHelper className="mt-2">These chips explain the natural-language search. Open Refine search only when you need narrower database controls.</InlineHelper></section>}`,
              `{intent.hasStructuredIntent && <section className="px-1" aria-label="Interpreted search terms"><div className="flex flex-wrap items-center gap-2"><p className="mr-1 text-[0.68rem] font-semibold uppercase tracking-wide text-[#625C70]">Search interpreted as</p>{intent.chips.map((chip) => <span key={chip.key} className="rounded-full bg-[#F7F4FF] px-2.5 py-1 text-xs font-semibold text-[#5B4B8A]">{chip.label}</span>)}</div></section>}`,
              "production opportunity interpreted-search block",
            )
            next = replaceOnce(
              next,
              `        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-1" aria-label="Opportunity trust indicators"><TrustIndicator>Worldwide sourced search</TrustIndicator><TrustIndicator>Visual-first when equally relevant</TrustIndicator><TrustIndicator>Artist review before submission</TrustIndicator></div>\n\n`,
              "",
              "production opportunity trust strip",
            )
            next = replaceOnce(
              next,
              `        <ExpandableInfo label="How KLEIO works here" summary="search, readiness, visuals, and submission boundaries" className="px-1"><div className="grid gap-3 md:grid-cols-2 xl:grid-cols-4"><section><p className="font-semibold text-[#292631]">Sourced discovery</p><p className="mt-1">Only approved records are searched. Unknown fee, funding, deadline, or eligibility details remain unknown.</p></section><section><p className="font-semibold text-[#292631]">Visual priority</p><p className="mt-1">When results are equally relevant, verified official visuals appear first. Missing visuals use a KLEIO fallback until rights-safe imagery is confirmed.</p></section><section><p className="font-semibold text-[#292631]">Readiness</p><p className="mt-1">A percentage appears only when source requirements are structured and can be compared with actual Passport materials.</p></section><section><p className="font-semibold text-[#292631]">Submission</p><p className="mt-1">Preparing or exporting a package is not submission. Native submission requires explicit artist approval and database validation.</p></section></div></ExpandableInfo>\n\n`,
              "",
              "production opportunity methodology walkthrough",
            )
            next = replaceOnce(
              next,
              `{!loading && !error && <p aria-live="polite" className="px-1 text-sm text-muted-foreground"><strong className="text-foreground">{items.length} verified result{items.length === 1 ? "" : "s"}.</strong>{items.length === 0 ? " No exact database match is currently available. Broaden one filter or review the official source directory later." : " Search refinements remain saved on this device."}</p>}`,
              `{!loading && !error && <p aria-live="polite" className="px-1 text-sm text-muted-foreground"><strong className="text-foreground">{items.length} verified result{items.length === 1 ? "" : "s"}.</strong>{items.length === 0 ? " Broaden one filter or return later as verified coverage expands." : ""}</p>}`,
              "production opportunity result summary",
            )
            return next
          })

          update("components/kleio/live-global-artist-opportunities-with-images.tsx", (source) => {
            let next = replaceOnce(
              source,
              'import { ExpandableInfo, InlineHelper, TrustIndicator } from "@/components/kleio/guidance-system"\n',
              "",
              "legacy opportunity guidance import",
            )
            next = replaceOnce(
              next,
              'description="Describe what you are looking for naturally. KLEIO translates your words into visible search criteria and searches only sourced opportunity records."',
              'description="Search sourced artist opportunities by medium, location, type, or format."',
              "legacy opportunity page description",
            )
            next = replaceOnce(
              next,
              `        <p className="mt-2 text-xs leading-relaxed text-muted-foreground">Use normal language. KLEIO interprets your words as search filters; it never turns your request into a new opportunity listing.</p>\n`,
              "",
              "legacy opportunity search helper",
            )
            next = replaceOnce(
              next,
              `    {intent.hasStructuredIntent && <section className="px-1" aria-label="Interpreted search filters">\n      <div className="flex flex-wrap items-center gap-2">\n        <p className="mr-1 text-[0.68rem] font-semibold uppercase tracking-wide text-[#625C70]">KLEIO understood</p>\n        {intent.chips.map((item) => <span key={item.key} className="rounded-full bg-[#F7F4FF] px-2.5 py-1 text-xs font-semibold text-[#5B4B8A]">{item.label}</span>)}\n      </div>\n      <InlineHelper className="mt-2">These criteria come from your wording. The controls above can refine the interpreted type, source, format, and fee.</InlineHelper>\n    </section>}`,
              `    {intent.hasStructuredIntent && <section className="px-1" aria-label="Interpreted search filters">\n      <div className="flex flex-wrap items-center gap-2">\n        <p className="mr-1 text-[0.68rem] font-semibold uppercase tracking-wide text-[#625C70]">Search interpreted as</p>\n        {intent.chips.map((item) => <span key={item.key} className="rounded-full bg-[#F7F4FF] px-2.5 py-1 text-xs font-semibold text-[#5B4B8A]">{item.label}</span>)}\n      </div>\n    </section>}`,
              "legacy opportunity interpreted-search block",
            )
            next = replaceOnce(
              next,
              `\n    <div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-1" aria-label="Opportunity trust indicators">\n      <TrustIndicator>Worldwide sourced search</TrustIndicator>\n      <TrustIndicator>Original source preserved</TrustIndicator>\n      <TrustIndicator>Artist review before submission</TrustIndicator>\n    </div>\n\n    <ExpandableInfo label="How KLEIO works here" summary="search, translation, readiness, and messaging" className="px-1">\n      <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-4">\n        <section><p className="font-semibold text-[#292631]">Worldwide discovery</p><p className="mt-1">KLEIO searches sourced records across regions and languages. Eligibility is checked separately against stated rules and Creative Passport data.</p></section>\n        <section><p className="font-semibold text-[#292631]">Translation</p><p className="mt-1">Original titles, deadlines, currencies, requirements, and official sources remain authoritative. Binding language needs human review when a translation is not verified.</p></section>\n        <section><p className="font-semibold text-[#292631]">Readiness</p><p className="mt-1">Readiness uses confirmed source requirements and actual Passport materials. Preparing a package does not submit it.</p></section>\n        <section><p className="font-semibold text-[#292631]">Messaging</p><p className="mt-1">Conversations follow an invitation or submitted application. A listing alone does not open unsolicited institution messaging.</p></section>\n      </div>\n    </ExpandableInfo>`,
              "",
              "legacy opportunity trust and methodology walkthrough",
            )
            next = replaceOnce(
              next,
              '  if (mode === "exact") return <p aria-live="polite" className="px-1 text-sm text-emerald-700"><strong>{count} exact database match{count === 1 ? "" : "es"}.</strong> Every displayed record matches the interpreted criteria KLEIO could verify.</p>',
              '  if (mode === "exact") return <p aria-live="polite" className="px-1 text-sm text-muted-foreground"><strong className="text-foreground">{count} verified result{count === 1 ? "" : "s"}.</strong></p>',
              "legacy opportunity exact-result summary",
            )
            return next
          })

          fs.writeFileSync("scripts/audit-guidance-hierarchy.mjs", `import fs from "node:fs"\nimport path from "node:path"\n\nconst roots = ["app", "components"]\nconst files = []\n\nfunction walk(directory) {\n  if (!fs.existsSync(directory)) return\n  for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {\n    const target = path.join(directory, entry.name)\n    if (entry.isDirectory()) walk(target)\n    else if (/\\.(tsx|ts|jsx|js)$/.test(entry.name)) files.push(target)\n  }\n}\n\nfor (const root of roots) walk(root)\n\nconst failures = []\nconst bannedCopy = [\n  "Worldwide discovery:",\n  "Translation protocol:",\n  "Messaging boundary:",\n  "How KLEIO works here",\n  "These chips explain the natural-language search",\n  "These criteria come from your wording",\n  "search, readiness, visuals, and submission boundaries",\n  "search, translation, readiness, and messaging",\n]\nconst productDirectoryFiles = new Set([\n  "components/kleio/production-artist-opportunity-directory.tsx",\n  "components/kleio/live-global-artist-opportunities-with-images.tsx",\n])\n\nfor (const file of files) {\n  const source = fs.readFileSync(file, "utf8")\n  const normalizedFile = file.split(path.sep).join("/")\n  for (const phrase of bannedCopy) {\n    if (source.includes(phrase)) failures.push(file + ": persistent walkthrough copy returned: " + phrase)\n  }\n  if (source.includes("<AlertCircle") && (source.includes('"Current priority"') || source.includes('"Cycle priority"'))) {\n    failures.push(file + ": ordinary workflow focus is still paired with alert iconography")\n  }\n  if (productDirectoryFiles.has(normalizedFile) && source.includes("<ExpandableInfo")) {\n    failures.push(file + ": methodology walkthrough returned to a live opportunity directory")\n  }\n  if (productDirectoryFiles.has(normalizedFile) && source.includes("<TrustIndicator")) {\n    failures.push(file + ": persistent trust strip returned to a live opportunity directory")\n  }\n}\n\nconst required = fs.readFileSync("components/kleio/guidance-system.tsx", "utf8")\nfor (const component of ["InlineHelper", "TrustIndicator", "FocusLabel", "ExpandableInfo", "FirstUseHint"]) {\n  if (!required.includes("export function " + component)) failures.push("guidance-system.tsx: missing " + component)\n}\n\nif (failures.length) {\n  console.error("KLEIO guidance hierarchy audit failed:\\n" + failures.map((failure) => "- " + failure).join("\\n"))\n  process.exit(1)\n}\n\nconsole.log("KLEIO guidance hierarchy audit passed across " + files.length + " source files.")\n`)
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Verify guidance hierarchy
        run: pnpm audit:guidance

      - name: Verify user-facing copy
        run: pnpm audit:user-copy

      - name: Verify type safety
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/kleio/production-artist-opportunity-directory.tsx components/kleio/live-global-artist-opportunities-with-images.tsx scripts/audit-guidance-hierarchy.mjs
          git commit -m "Remove walkthrough copy from live product pages"
          git push origin HEAD:fix/remove-product-walkthrough-copy
