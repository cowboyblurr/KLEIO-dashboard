name: Apply focused Gemini PR audit corrections

on:
  push:
    branches:
      - agent/gemini-document-intelligence
    paths:
      - ".github/workflows/fix-gemini-pr-audits.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gemini-document-intelligence
          fetch-depth: 0
      - name: Correct analytics metadata audit scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          audit = Path("scripts/audit-product-analytics-privacy.mjs")
          text = audit.read_text()
          old = r"content.matchAll(/metadata\s*:\s*\{([^{}]*)\}/g)"
          new = r"content.matchAll(/(?<![A-Za-z0-9_])metadata\s*:\s*\{([^{}]*)\}/g)"
          if old not in text:
              raise SystemExit("analytics metadata audit expression not found")
          audit.write_text(text.replace(old, new))

          carousel = Path("components/kleio/public-opportunity-carousel.tsx")
          text = carousel.read_text()
          old = 'metadata: { source: "landing_carousel", access: "limited_preview" }'
          count = text.count(old)
          if count < 1:
              raise SystemExit("carousel analytics access metadata not found")
          carousel.write_text(text.replace(old, 'metadata: { source: "landing_carousel", mode: "limited_preview" }'))
          print(f"Updated {count} carousel analytics payload(s).")
          PY
          git config user.name "KLEIO GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/audit-product-analytics-privacy.mjs components/kleio/public-opportunity-carousel.tsx
          git commit -m "Scope analytics audit to actual metadata payloads"
          git push origin HEAD:agent/gemini-document-intelligence
