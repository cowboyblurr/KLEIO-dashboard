name: Apply Instagram gallery polish

on:
  push:
    branches:
      - fix/instagram-oauth-state-and-callback
    paths:
      - .github/workflows/apply-instagram-gallery-polish.yml

permissions:
  contents: write

jobs:
  apply-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Write verified Instagram gallery component
        shell: python
        run: |
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          payload = """"""
          content = zlib.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(content).hexdigest()
          if digest != "3846f1c18b8fd09ed43fa169baf4a7967a0eb64079190a7907bdf90c7c797e65":
              raise SystemExit(f"Unexpected component digest: {digest}")
          Path("components/kleio/instagram-import-assist.tsx").write_bytes(content)

      - name: Commit focused gallery update
        run: |
          git config user.name "KLEIO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/instagram-import-assist.tsx
          git rm .github/workflows/apply-instagram-gallery-polish.yml
          git commit -m "Build accessible Instagram selection studio"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
