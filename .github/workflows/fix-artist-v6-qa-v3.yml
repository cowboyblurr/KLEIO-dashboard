name: Repair artist V6 QA findings v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.head_ref == 'fix/artist-v6-qa-v2-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS: true
      NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
      NEXT_PUBLIC_SITE_URL: https://cowboyblurr.github.io/KLEIO-dashboard
      NEXT_PUBLIC_SUPABASE_URL: https://trekynurdgxgtaaqqtyq.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XdYXvd0fQm3IJKxNrFXgUQ_M4RgDj1M
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply audited repair script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/fix-artist-v6-qa-v2.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Targeted regression gates"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'v6-repair-script', 'exec'))
          PY

      - name: Targeted regression gates
        run: |
          pnpm audit:artist-beta-convenience
          pnpm audit:artist-import
          pnpm audit:upload-to-passport
          pnpm audit:opportunity-search
          pnpm audit:application-composer
          node scripts/audit-gmail-send-beta.mjs
          pnpm audit:auth-redirect
          pnpm audit:auth-isolation
          pnpm test:artist-workflow-services
          pnpm typecheck
          pnpm lint

      - name: Build before route audit
        run: |
          pnpm build
          pnpm audit:navigation
          pnpm audit:user-copy
          pnpm audit:visual-convenience

      - name: Commit verified repairs
        run: |
          if git diff --quiet; then
            echo "Repairs are already present; nothing to commit."
            exit 0
          fi
          git config user.name "KLEIO QA Repair"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/application-composer-workspace.tsx \
                  components/kleio/gmail-delivery-control.tsx \
                  components/kleio/artist-media-library.tsx \
                  components/kleio/media-intelligence-sheet.tsx \
                  components/kleio/recipient-application-review.tsx \
                  lib/kleio-application-delivery.ts \
                  lib/kleio-persistent-opportunity-directory.ts \
                  lib/kleio-public-opportunity-directory.ts \
                  scripts/audit-opportunity-search.mjs
          git commit -m "Fix artist V6 QA findings"
          git push origin HEAD:${{ github.head_ref }}
