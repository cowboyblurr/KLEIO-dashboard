name: Fix Instagram brand mark

on:
  push:
    branches:
      - fix/instagram-oauth-state-and-callback
    paths:
      - .github/workflows/fix-instagram-brand-mark.yml

permissions:
  contents: write

jobs:
  patch-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - name: Replace unsupported brand icon
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/kleio/instagram-import-assist.tsx")
          source = path.read_text()
          source = source.replace("  Instagram,\n", "")
          marker = '''function FieldStatus({ item, name }: { item: InstagramPreparedItem; name: keyof InstagramPreparedItem["fields"] }) {'''
          icon = '''function InstagramMark() {
            return (
              <svg viewBox="0 0 24 24" className="size-5" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4.25" />
                <circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none" />
              </svg>
            )
          }

          function FieldStatus({ item, name }: { item: InstagramPreparedItem; name: keyof InstagramPreparedItem["fields"] }) {'''
          if marker not in source:
              raise SystemExit("FieldStatus marker not found")
          source = source.replace(marker, icon, 1)
          target = '<Instagram className="size-5" aria-hidden="true" />'
          if target not in source:
              raise SystemExit("Instagram icon target not found")
          source = source.replace(target, '<InstagramMark />', 1)
          path.write_text(source)

      - name: Commit icon fix
        run: |
          git config user.name "KLEIO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/kleio/instagram-import-assist.tsx
          git rm .github/workflows/fix-instagram-brand-mark.yml
          git commit -m "Use a local Instagram connection mark"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
