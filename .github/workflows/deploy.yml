name: Deploy KLEIO Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit production auth redirects
        env:
          CI: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
          NEXT_PUBLIC_SITE_URL: https://cowboyblurr.github.io/KLEIO-dashboard
        run: pnpm run audit:auth-redirect

      - name: Build static site
        id: pages_build
        continue-on-error: true
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
          NEXT_PUBLIC_SITE_URL: https://cowboyblurr.github.io/KLEIO-dashboard
          NEXT_PUBLIC_SUPABASE_URL: https://trekynurdgxgtaaqqtyq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XdYXvd0fQm3IJKxNrFXgUQ_M4RgDj1M
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee pages-build.log

      - name: Verify static export output
        id: export_output
        if: steps.pages_build.outcome == 'success'
        run: |
          echo "Checking static export output..."
          test -d out
          test -f out/index.html
          touch out/.nojekyll
          echo "Top-level exported files:"
          find out -maxdepth 2 -type f | sort | head -120
          echo "Checking signup and recovery exports..."
          test -f out/signup/artist/index.html
          test -f out/signup/institution/index.html
          test -f out/auth/callback/index.html
          test -f out/auth/forgot-password/index.html
          test -f out/auth/update-password/index.html
          echo "Checking core workspace exports..."
          test -f out/dashboard/index.html
          test -f out/artist-dashboard/index.html
          test -f out/collaborator-dashboard/index.html
          test -f out/collaborator-dashboard/review-queue/index.html
          test -f out/review-queue/index.html
          test -f out/review-room/index.html
          test -f out/shortlist/index.html
          test -f out/committee/index.html
          test -f out/messages/index.html
          test -f out/activity-log/index.html
          test -f out/reports/index.html
          echo "Checking profile and entity exports..."
          test -f out/demo/index.html
          test -f out/artists/index.html
          test -f out/artists/applicants/index.html
          test -f out/artists/amina-el-badri/index.html
          test -f out/artist/amina-el-badri/index.html
          test -f out/institution/kleio-arthouse/index.html
          echo "Checking artist opportunity detail export..."
          test -f out/artist-dashboard/opportunities/lumen-arts-grant/index.html
          echo "Checking submission detail export..."
          test -f out/submissions/amina-el-badri/index.html
          echo "Checking program detail export..."
          test -f out/programs/residency-2026/index.html

      - name: Verify production and demo separation
        id: production_separation
        if: steps.pages_build.outcome == 'success'
        run: |
          echo "Checking that the public homepage contains the live authentication gateway..."
          grep -Fq "Enter your KLEIO workspace" out/index.html

          echo "Checking that demo credentials and synthetic-product labels are absent from the public homepage..."
          if grep -Eq "institution@kleio\.demo|artist@kleio\.demo|reviewer@kleio\.demo|kleio2026|Prototype · Synthetic data" out/index.html; then
            echo "The public homepage contains demo-only content. Refusing to deploy."
            exit 1
          fi

          echo "Checking that the guided demo remains available as a separate destination..."
          test -f out/demo/index.html

      - name: Audit internal navigation
        id: navigation
        if: steps.pages_build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          pnpm run audit:navigation 2>&1 | tee pages-navigation.log

      - name: Upload GitHub Pages diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-diagnostics
          path: |
            pages-build.log
            pages-navigation.log
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && steps.pages_build.outcome == 'success' && steps.export_output.outcome == 'success' && steps.production_separation.outcome == 'success' && steps.navigation.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Enforce GitHub Pages validation
        if: always()
        run: |
          echo "pages_build=${{ steps.pages_build.outcome }}"
          echo "export_output=${{ steps.export_output.outcome }}"
          echo "production_separation=${{ steps.production_separation.outcome }}"
          echo "navigation=${{ steps.navigation.outcome }}"
          test "${{ steps.pages_build.outcome }}" = "success"
          test "${{ steps.export_output.outcome }}" = "success"
          test "${{ steps.production_separation.outcome }}" = "success"
          test "${{ steps.navigation.outcome }}" = "success"

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live production routes
        env:
          SITE_URL: https://cowboyblurr.github.io/KLEIO-dashboard
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          SITE_ORIGIN="$(printf '%s' "$SITE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          check_route() {
            route="$1"
            required="$2"
            forbidden="${3:-}"
            url="${SITE_URL}${route}?verification=${GITHUB_SHA}"
            body="$(mktemp)"
            success="false"
            for attempt in $(seq 1 18); do
              status="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --max-time 30 "$url" || true)"
              if [ "$status" = "200" ] && grep -Fq "$required" "$body"; then
                if [ -n "$forbidden" ] && grep -Eq "$forbidden" "$body"; then
                  echo "Forbidden production marker found on ${route}."
                  cat "$body"
                  exit 1
                fi
                success="true"
                break
              fi
              echo "Waiting for ${route} to serve the deployed export (attempt ${attempt}/18, HTTP ${status})..."
              sleep 10
            done
            if [ "$success" != "true" ]; then
              echo "Production verification failed for ${route}."
              cat "$body"
              exit 1
            fi
          }

          check_client_bundle() {
            route="$1"
            required_one="$2"
            required_two="$3"
            forbidden="$4"
            html="$(mktemp)"
            bundle="$(mktemp)"
            curl --silent --show-error --location --fail --max-time 30 "${SITE_URL}${route}?bundle_verification=${GITHUB_SHA}" > "$html"
            grep -oE 'src="[^"]+\.js"' "$html" | cut -d'"' -f2 | sort -u | while read -r src; do
              curl --silent --show-error --location --fail --max-time 30 "${SITE_ORIGIN}${src}?bundle_verification=${GITHUB_SHA}" >> "$bundle"
            done
            grep -Fq "$required_one" "$bundle"
            grep -Fq "$required_two" "$bundle"
            if grep -Eq "$forbidden" "$bundle"; then
              echo "Deprecated guidance treatment found in live client bundle."
              exit 1
            fi
          }

          check_route "/" "Enter your KLEIO workspace" "institution@kleio\.demo|artist@kleio\.demo|Prototype · Synthetic data"
          check_route "/signup/artist/" "LiveSignup" "Prototype · Synthetic data"
          check_route "/signup/institution/" "LiveSignup" "Prototype · Synthetic data"
          check_route "/auth/callback/" "Confirming your account" "localhost:3000"
          check_client_bundle "/artist-dashboard/opportunities/" "How KLEIO works here" "Worldwide sourced search" "Translation protocol:|Messaging boundary:|Worldwide discovery:"
