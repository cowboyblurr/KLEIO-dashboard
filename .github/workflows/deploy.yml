name: Deploy KLEIO Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static site
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
        run: pnpm run build

      - name: Verify static export output
        run: |
          echo "Checking static export output..."
          test -d out
          test -f out/index.html
          touch out/.nojekyll
          echo "Top-level exported files:"
          find out -maxdepth 2 -type f | sort | head -120
          echo "Checking for guided demo export..."
          test -f out/demo/index.html
          echo "Checking for artist directory export..."
          test -f out/artists/index.html
          echo "Checking for artist opportunity detail export..."
          test -f out/artist-dashboard/opportunities/lumen-arts-grant/index.html
          echo "Checking for submission detail export..."
          test -f out/submissions/amina-el-badri/index.html
          echo "Checking for program detail export..."
          test -f out/programs/residency-2026/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
