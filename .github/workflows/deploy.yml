name: Deploy KLEIO Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static site
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
        run: pnpm run build

      - name: Verify static export output
        run: |
          echo "Checking static export output..."
          test -d out
          test -f out/index.html
          touch out/.nojekyll
          echo "Top-level exported files:"
          find out -maxdepth 2 -type f | sort | head -120
          echo "Checking for expected updated KLEIO demo copy in exported files..."
          grep -R "collaborator review flow" out | head || true
          grep -R "Enter Collaborator Demo" out | head || true
          grep -R "reviewer@kleio.demo" out | head || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 10
          reporting_interval: 5000
