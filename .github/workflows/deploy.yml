name: Deploy KLEIO Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static site
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
        run: pnpm run build

      - name: Verify static export output
        run: |
          echo "Checking static export output..."
          test -d out
          test -f out/index.html
          touch out/.nojekyll
          echo "Checking public and trust routes..."
          test -f out/about/index.html
          test -f out/manifesto/index.html
          test -f out/journal/index.html
          test -f out/privacy/index.html
          test -f out/terms/index.html
          test -f out/contact/index.html
          test -f out/signup/artist/index.html
          test -f out/signup/institution/index.html
          echo "Checking core institution workspace exports..."
          test -f out/dashboard/index.html
          test -f out/programs/index.html
          test -f out/submissions/index.html
          test -f out/artists/index.html
          test -f out/review-queue/index.html
          test -f out/review-room/index.html
          test -f out/shortlist/index.html
          test -f out/committee/index.html
          test -f out/messages/index.html
          test -f out/activity-log/index.html
          test -f out/reports/index.html
          test -f out/settings/index.html
          echo "Checking artist workspace exports..."
          test -f out/artist-dashboard/index.html
          test -f out/artist-dashboard/passport/index.html
          test -f out/artist-dashboard/opportunities/index.html
          test -f out/artist-dashboard/applications/index.html
          test -f out/artist-dashboard/portfolio/index.html
          test -f out/artist-dashboard/funding/index.html
          test -f out/artist-dashboard/settings/index.html
          echo "Checking demo and canonical entity exports..."
          test -f out/demo/index.html
          test -f out/artists/amina-el-badri/index.html
          test -f out/artist/amina-el-badri/index.html
          test -f out/institution/kleio-arthouse/index.html
          test -f out/artist-dashboard/opportunities/lumen-arts-grant/index.html
          test -f out/submissions/amina-el-badri/index.html
          test -f out/programs/residency-2026/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
