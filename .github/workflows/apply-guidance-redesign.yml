name: Apply KLEIO guidance redesign

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-guidance-redesign.mjs
      - .github/workflows/apply-guidance-redesign.yml

permissions:
  contents: write

concurrency:
  group: kleio-guidance-redesign
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=silent

      - name: Apply contextual guidance system
        run: node scripts/apply-guidance-redesign.mjs

      - name: Verify type safety
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Verify production build
        env:
          GITHUB_ACTIONS: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
          NEXT_PUBLIC_SITE_URL: https://cowboyblurr.github.io/KLEIO-dashboard
          NEXT_PUBLIC_SUPABASE_URL: https://trekynurdgxgtaaqqtyq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XdYXvd0fQm3IJKxNrFXgUQ_M4RgDj1M
        run: pnpm build

      - name: Verify navigation
        run: pnpm audit:navigation

      - name: Verify user-facing copy
        run: pnpm audit:user-copy

      - name: Verify authentication redirects
        env:
          CI: "true"
          NEXT_PUBLIC_BASE_PATH: /KLEIO-dashboard
          NEXT_PUBLIC_SITE_URL: https://cowboyblurr.github.io/KLEIO-dashboard
        run: pnpm audit:auth-redirect

      - name: Verify guidance hierarchy
        run: pnpm audit:guidance

      - name: Commit verified redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply sitewide contextual guidance redesign"
          git push origin HEAD:main
