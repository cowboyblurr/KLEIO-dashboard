name: Apply unified Import Studio source hub

on:
  push:
    branches:
      - agent/unified-import-source-hub
    paths:
      - .github/workflows/apply-unified-import-source-hub.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-import-source-hub
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Implement the unified source hub and restricted-source guardrails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Could not locate expected content in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

