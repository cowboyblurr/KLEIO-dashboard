          Path("scripts/audit-import-source-hub.mjs").write_text(r'''import { readFileSync } from "node:fs"

const read = (path) => readFileSync(new URL(`../${path}`, import.meta.url), "utf8")
const requireText = (content, pattern, message) => { if (!pattern.test(content)) throw new Error(message) }
const forbidText = (content, pattern, message) => { if (pattern.test(content)) throw new Error(message) }

const page = read("components/kleio/artist-import-studio-page.tsx")
const hub = read("components/kleio/import-source-hub.tsx")
const pinterest = read("components/kleio/pinterest-import-assist.tsx")
const website = read("components/kleio/website-import-assist.tsx")
const client = read("lib/kleio-website-import.ts")
const collector = read("supabase/functions/analyze-artist-website/index.ts")

requireText(page, /<ImportSourceHub \/>/, "The artist import route must begin with one source-selection hub.")
requireText(page, /id="device-drive-import"/, "Device and Drive import must have a stable source destination.")
requireText(page, /id="website-import"/, "Website import must have a stable source destination.")
requireText(page, /<PinterestImportAssist \/>/, "Pinterest setup status must be visible inside the Import Studio route.")
requireText(page, /id="instagram-import"/, "The existing Instagram importer must remain available without displacing the four primary source choices.")

for (const label of ["Upload from device", "Choose from Google Drive", "Import from website", "Connect Pinterest"]) {
  requireText(hub, new RegExp(label), `Missing primary import source: ${label}`)
}
requireText(hub, /NEXT_PUBLIC_GOOGLE_DRIVE_CLIENT_ID/, "Drive readiness must reflect actual deployment configuration.")
requireText(hub, /App approval required/, "Pinterest must not appear production-ready before app approval.")
requireText(hub, /Behance and ArtStation remain external portfolio links only/, "Restricted portfolio platforms must be described honestly.")

requireText(pinterest, /data-integration-status="configuration-required"/, "Pinterest must expose a machine-readable non-production status.")
requireText(pinterest, /boards:read/, "Pinterest planning must request the minimum board read scope.")
requireText(pinterest, /pins:read/, "Pinterest planning must request the minimum Pin read scope.")
requireText(pinterest, /disabled aria-disabled="true"/, "Pinterest connection must remain disabled until the production flow exists.")
requireText(pinterest, /No scraping or password collection/, "Pinterest must explicitly reject scraping and password collection.")
forbidText(pinterest, /api\.pinterest\.com|www\.pinterest\.com\/oauth|client_secret|access_token|refresh_token/, "The status component must not contain a fake or client-side Pinterest OAuth implementation.")

for (const host of ["behance.net", "artstation.com"]) {
  requireText(website, new RegExp(host.replace(".", "\\.")), `Website UI must block ${host}.`)
  requireText(collector, new RegExp(host.replace(".", "\\.")), `Website backend must block ${host}.`)
}
requireText(collector, /UNSUPPORTED_IMPORT_HOSTS/, "The backend must maintain a restricted-source host list.")
requireText(collector, /unsupportedImportHostname/, "The backend must validate the submitted source before collection.")
requireText(collector, /unsupported_import_source/, "The backend must return a stable restricted-source error.")
requireText(client, /unsupported import source/, "The client must translate restricted-source errors into artist-facing guidance.")

for (const content of [hub, pinterest, website, client, collector]) {
  forbidText(content, /GOCSPX-|pina_[A-Za-z0-9_-]+|pinr_[A-Za-z0-9_-]+|client_secret\s*[:=]\s*["'][^"']+/, "A provider secret or token appears to be committed.")
}

console.log("Import source hub audit passed: four primary source choices, honest Drive readiness, Pinterest production gating, preserved Instagram access, and frontend/backend Behance and ArtStation restrictions are present.")
''')

