name: Website Import Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "components/kleio/website-import-assist.tsx"
      - "components/kleio/artist-import-studio-page.tsx"
      - "lib/kleio-website-import.ts"
      - "scripts/audit-website-import-assist.mjs"
      - "supabase/functions/analyze-artist-website/**"
      - "supabase/functions/kleio-assist/**"
      - "supabase/migrations/20260801223000_website_import_assist.sql"
      - "supabase/migrations/20260801224000_kleio_assist_drafts.sql"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Website Import audit
        run: pnpm audit:website-import

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
