name: Apply Compact Document Analysis UI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply_compact_document_analysis_ui.py"
      - ".github/workflows/apply-compact-document-analysis-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ui/compact-document-analysis-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python scripts/apply_compact_document_analysis_ui.py
      - name: Commit compact analysis UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/kleio/artist-document-intelligence.tsx
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "Redesign Gemini analysis results for guided review"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
