name: Audit Visual Obstructions

on:
  push:
    branches:
      - ui/document-result-controls
    paths:
      - scripts/audit_visual_obstructions.py
      - .github/workflows/audit-visual-obstructions.yml
      - components/**
      - app/**

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/document-result-controls
          fetch-depth: 0
      - name: Inventory sticky, fixed and oversized surfaces
        run: python scripts/audit_visual_obstructions.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-obstruction-audit.json docs/visual-obstruction-audit.md
          git diff --cached --quiet || git commit -m "Audit site-wide visual obstructions"
          git push origin HEAD:ui/document-result-controls
