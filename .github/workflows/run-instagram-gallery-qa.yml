name: Run Instagram gallery QA

on:
  push:
    branches:
      - fix/instagram-oauth-state-and-callback
    paths:
      - .github/workflows/run-instagram-gallery-qa.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instagram-oauth-state-and-callback
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run and record quality checks
        shell: bash
        run: |
          mkdir -p .qa /tmp/kleio-qa
          set +e
          pnpm typecheck > /tmp/kleio-qa/typecheck.log 2>&1
          TYPECHECK=$?
          pnpm lint > /tmp/kleio-qa/lint.log 2>&1
          LINT=$?
          pnpm audit:instagram-import > /tmp/kleio-qa/audit.log 2>&1
          AUDIT=$?
          pnpm build > /tmp/kleio-qa/build.log 2>&1
          BUILD=$?
          set -e

          {
            echo "Instagram gallery QA"
            echo "commit=$(git rev-parse HEAD)"
            echo "typecheck=$TYPECHECK"
            echo "lint=$LINT"
            echo "instagram_audit=$AUDIT"
            echo "production_build=$BUILD"
            echo
            for name in typecheck lint audit build; do
              echo "===== $name ====="
              tail -n 80 "/tmp/kleio-qa/$name.log"
              echo
            done
          } > .qa/instagram-gallery-report.txt

      - name: Commit QA report and remove runner
        run: |
          git config user.name "KLEIO QA"
          git config user.email "actions@users.noreply.github.com"
          git add .qa/instagram-gallery-report.txt
          git rm .github/workflows/run-instagram-gallery-qa.yml
          git commit -m "Record Instagram selection studio QA"
          git push origin HEAD:fix/instagram-oauth-state-and-callback
