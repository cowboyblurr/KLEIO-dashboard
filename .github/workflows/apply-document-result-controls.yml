name: Apply Document Result Controls

on:
  push:
    branches:
      - ui/document-result-controls
    paths:
      - scripts/apply_document_result_controls.py
      - .github/workflows/apply-document-result-controls.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/document-result-controls
          fetch-depth: 0
      - name: Apply result controls
        run: python scripts/apply_document_result_controls.py
      - name: Commit result controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/kleio/artist-document-intelligence.tsx
          git diff --cached --quiet || git commit -m "Make document analysis controls immediate and reversible"
          git push origin HEAD:ui/document-result-controls
