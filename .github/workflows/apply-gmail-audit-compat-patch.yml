name: Apply Gmail Audit Compatibility Patch

on:
  push:
    branches:
      - feature/gmail-send-beta-20260808
    paths:
      - ".github/workflows/apply-gmail-audit-compat-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gmail-send-beta-20260808
          fetch-depth: 0
      - name: Move legacy assertions to the unified delivery owner
        shell: python
        run: |
          from pathlib import Path
          import re

          composer_audit = Path("scripts/audit-application-composer-lock.mjs")
          s = composer_audit.read_text()
          if 'gmail-delivery-control.tsx' not in s:
              s = s.replace(
                  'const composer = read("components/kleio/application-composer-workspace.tsx")\n',
                  'const composer = read("components/kleio/application-composer-workspace.tsx")\nconst gmailDeliveryControl = read("components/kleio/gmail-delivery-control.tsx")\n',
                  1,
              )
          s = re.sub(
              r'requireText\(composer, /Open email to send/, "[^"]*"\)',
              'requireText(gmailDeliveryControl, /Open email to send|Open email instead/, "The finalized email delivery control must preserve the honest manual fallback without claiming a provider send.")',
              s,
              count=1,
          )
          s = re.sub(
              r'requireText\(composer, /prepareTrackedEmailClientHandoff/, "[^"]*"\)',
              'requireText(composer, /GmailDeliveryControl/, "The canonical finalized composer must mount the unified Gmail/manual delivery control.")\nrequireText(deliveryClient, /prepareTrackedEmailClientHandoff/, "The manual fallback must still create the hardened tracked Review Room handoff.")',
              s,
              count=1,
          )
          s = re.sub(
              r'requireText\(composer, /secure Review Room access for this exact preserved version/, "[^"]*"\)',
              'requireText(gmailDeliveryControl, /same immutable KLEIO application|secure Review Room|preserved application/i, "The delivery control must keep the immutable-version Review Room contract visible to the artist.")',
              s,
              count=1,
          )
          composer_audit.write_text(s)

          convenience = Path("scripts/audit-artist-beta-convenience.mjs")
          c = convenience.read_text()
          if 'gmailControl:' not in c:
              c = c.replace(
                  '  composer: read("components/kleio/application-composer-workspace.tsx"),\n',
                  '  composer: read("components/kleio/application-composer-workspace.tsx"),\n  gmailControl: read("components/kleio/gmail-delivery-control.tsx"),\n  delivery: read("lib/kleio-application-delivery.ts"),\n',
                  1,
              ) if '  delivery: read("lib/kleio-application-delivery.ts"),' not in c else c.replace(
                  '  composer: read("components/kleio/application-composer-workspace.tsx"),\n',
                  '  composer: read("components/kleio/application-composer-workspace.tsx"),\n  gmailControl: read("components/kleio/gmail-delivery-control.tsx"),\n',
                  1,
              )
          pattern = re.compile(r'\["S24",\s*"Email handoff is one same-page tracked action",\s*\(\) => \{.*?\}\],', re.S)
          replacement = '''["S24", "Email handoff is one same-page tracked action", () => { must(s.composer, /GmailDeliveryControl/, "Finalized email delivery must stay inside the canonical composer."); must(s.gmailControl, /Open email to send|Open email instead/, "The unified delivery control must preserve the honest manual fallback."); must(s.delivery, /prepareTrackedEmailClientHandoff/, "Manual email must still route through tracked delivery."); must(s.delivery, /createRecipientReviewAccess/, "Tracked handoff must create secure Review Room access."); must(s.delivery, /buildMailtoHref/, "Beta fallback must still open the artist email client with the Review Room included."); never(s.composer, /const href = `mailto:/, "Composer must not bypass tracked delivery with a raw mailto handoff.") }],'''
          c, count = pattern.subn(replacement, c, count=1)
          if count != 1:
              raise SystemExit("S24 block not found exactly once")
          convenience.write_text(c)
      - name: Remove temporary workflow and commit audit updates
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-gmail-audit-compat-patch.yml
          git config user.name "KLEIO QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/audit-application-composer-lock.mjs scripts/audit-artist-beta-convenience.mjs .github/workflows/apply-gmail-audit-compat-patch.yml
          git commit -m "Align existing artist audits with unified Gmail delivery"
          git push origin HEAD:feature/gmail-send-beta-20260808
